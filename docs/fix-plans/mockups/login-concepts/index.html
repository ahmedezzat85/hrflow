<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRFlow login concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2056e8;--accent-soft:#e8eeff;--accent-text:#2056e8;--bg:#f7f8fb;--surface:#fff;--surface2:#fafbfd;--border:rgba(30,60,140,.08);--border2:rgba(30,60,140,.15);--text:#141e30;--text2:#556983;--shadow:0 2px 12px rgba(20,50,120,.07);--shadow-lg:0 20px 60px rgba(20,50,120,.16);color-scheme:light}
[data-theme="dark"]{--accent:#3566ef;--accent-soft:rgba(32,86,232,.18);--accent-text:#8fb0ff;--bg:#0f1117;--surface:#171a24;--surface2:#1d2130;--border:#2a2e3d;--border2:rgba(255,255,255,.14);--text:#f1f2f6;--text2:#9aa0b4;--shadow:0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 10px 40px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;font-size:14px}
header{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-family:Sora,sans-serif;font-size:16px;margin-right:auto}
header h1 small{display:block;font:500 12px Inter;color:var(--text2);margin-top:2px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:600 12.5px Inter;color:var(--text2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);font-weight:600;margin-right:8px}
nav{padding:18px;overflow:auto;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
nav button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--text);transition:.15s}
nav button:hover{border-color:var(--accent)}
nav button[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
nav b{display:block;font:700 14px Sora,sans-serif;margin-bottom:2px}nav span{font-size:12.5px;color:var(--text2);line-height:1.45;display:block}
nav b i{font-style:normal;color:var(--accent-text);margin-right:8px;font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 22px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--text2)}
.bar a{color:var(--accent-text);font-weight:600;text-decoration:none}.bar a:hover{text-decoration:underline}
.stage{flex:1;min-height:0;display:grid;place-items:center;background:var(--surface2);border:1px dashed var(--border2);border-radius:18px;padding:16px;overflow:auto}
.frame{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;height:100%;width:100%;transition:width .3s,height .3s,border-radius .3s;border:1px solid var(--border2)}
.frame.tablet{width:768px;max-width:100%}
.frame.mobile{width:390px;max-width:100%;height:min(100%,844px);border-radius:36px;border:8px solid #0b0d12}
iframe{width:100%;height:100%;border:0;display:block;background:var(--surface)}
@media(max-width:860px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100%}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border)}nav button{min-width:220px}main{min-height:80vh}}
</style></head><body>
<header>
 <h1>HRFlow login concepts<small>Clickable prototypes. Arrow keys switch concepts.</small></h1>
 <div><span class="lbl">Theme</span><span class="seg" id="g-theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark" aria-pressed="false">Dark</button></span></div>
 <div><span class="lbl">Device</span><span class="seg" id="g-dev"><button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="tablet" aria-pressed="false">Tablet</button><button data-v="mobile" aria-pressed="false">Mobile</button></span></div>
 <div><span class="lbl">State</span><span class="seg" id="g-state"><button data-v="default" aria-pressed="true">Default</button><button data-v="inactive" aria-pressed="false">Signed out</button><button data-v="error" aria-pressed="false">Error</button></span></div>
</header>
<nav id="nav"></nav>
<main><div class="bar"><span id="cur"></span><a id="open" target="_blank" rel="noopener">Open full page &#8599;</a></div>
 <div class="stage"><div class="frame" id="frame"><iframe id="fr" title="Login concept preview"></iframe></div></div></main>
<script>
var D=[{"file": "01-split-refined.html", "name": "Split Refined", "desc": "Your current layout, tidied. Logo leads the form, so it shows first on mobile."}, {"file": "02-centered-card.html", "name": "Centered Card", "desc": "One calm card on a soft dotted field. Highest focus, easiest on a phone."}, {"file": "03-aurora-glass.html", "name": "Aurora Glass", "desc": "Frosted card over slow brand-colored light, with floating module pills."}, {"file": "04-brand-panel.html", "name": "Brand Panel", "desc": "Bold blue brand panel with the white logo. It becomes a header banner on mobile."}, {"file": "05-bento-modules.html", "name": "Bento Modules", "desc": "Sign-in beside module tiles, with the logo in a header bar."}, {"file": "06-editorial.html", "name": "Editorial Minimal", "desc": "Typographic, hairline-ruled, no card. Quiet and confident."}], S={i:0,theme:'light',dev:'desktop',state:'default'};
try{var st=localStorage.getItem('hrflow-theme');if(st)S.theme=st;else if(matchMedia('(prefers-color-scheme:dark)').matches)S.theme='dark'}catch(e){}
var fr=document.getElementById('fr'),nav=document.getElementById('nav');
function url(){return D[S.i].file+'?theme='+S.theme+'&state='+S.state}
function load(){fr.src=url();document.getElementById('open').href=url();document.getElementById('cur').textContent=(S.i+1)+' / '+D.length+'  ·  '+D[S.i].name;
 [].forEach.call(nav.children,function(b,k){b.setAttribute('aria-current',k===S.i)})}
D.forEach(function(d,k){var b=document.createElement('button');b.innerHTML='<b><i>0'+(k+1)+'</i>'+d.name+'</b><span>'+d.desc+'</span>';b.onclick=function(){S.i=k;load()};nav.appendChild(b)});
function seg(id,key,fn){var el=document.getElementById(id);el.onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(!v)return;S[key]=v;[].forEach.call(el.children,function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});fn()}}
function sync(){[['g-theme','theme'],['g-dev','dev'],['g-state','state']].forEach(function(p){[].forEach.call(document.getElementById(p[0]).children,function(b){b.setAttribute('aria-pressed',b.dataset.v===S[p[1]])})});document.documentElement.setAttribute('data-theme',S.theme);document.getElementById('frame').className='frame '+(S.dev==='desktop'?'':S.dev)}
function push(){try{fr.contentWindow.postMessage({theme:S.theme,state:S.state},'*')}catch(e){}}
seg('g-theme','theme',function(){sync();push();try{localStorage.setItem('hrflow-theme',S.theme)}catch(e){}});
seg('g-dev','dev',sync);seg('g-state','state',function(){sync();push()});
addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowRight'){S.i=(S.i+1)%D.length;load()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){S.i=(S.i+D.length-1)%D.length;load()}});
fr.addEventListener('load',push);
sync();load();
</script></body></html>
