<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Add external user (approved reference, restyle v3)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="dTitle" style="width: 520px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #fbe7f0; color: #ad3469; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"></path></svg></span>
      <div style="flex: 1;"><h2 id="dTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Add external user</h2><div style="font-size: 12.5px; color: #5d6b8f;">No employee record · needs exactly one role</div></div>
      <a href="Sys-Users.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px;">
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Email<input placeholder="name@partner.example" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Name, optional<input placeholder="Priya Nair" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Role<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Financial-Admin</option></select></label>
      <p style="margin: 0; padding: 9px 12px; border-radius: 11px; background: #f7f9ff; font-size: 12.5px; color: #4b5c92;">They sign in with Google using this email address.</p>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="Sys-Users.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="Sys-Users.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Add user</a>
    </div>
  </div>
</div>
</body>
</html>
