<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Create role (approved reference, restyle v3)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="dTitle" style="width: 700px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #fbe7f0; color: #ad3469; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg></span>
      <div style="flex: 1;"><h2 id="dTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Create role</h2><div style="font-size: 12.5px; color: #5d6b8f;">Name the role and choose its permissions</div></div>
      <a href="Sys-Roles.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px 16px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Role name<input placeholder="HR-Assistant" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Description<input placeholder="What people with this role do" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 13px; font-weight: 700; color: #16245e;">Permissions <span style="font-weight: 500; color: #5d6b8f;">· 4 selected</span></span><label style="display: flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(32,86,232,.16); border-radius: 8px; background: #fff; color: #5d6b8f; font-size: 13px; width: 220px; white-space: nowrap;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Filter permissions</label></div>
      <div style="height: 340px; overflow: auto; border: 1px solid rgba(32,86,232,.12); border-radius: 12px;">
        
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #f7f9ff; border-bottom: 1px solid rgba(32,86,232,.08); font-size: 12.5px; font-weight: 700; color: #16245e;"><span>HR / Employees</span><span style="font-weight: 500; color: #5d6b8f;">2 of 2</span></div>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" checked="true" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">View company employee profiles</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee.read</span></span></label>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" checked="true" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">Create, edit and delete employee records</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee.write · includes hr.employee.read</span></span></label>
          
        
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #f7f9ff; border-bottom: 1px solid rgba(32,86,232,.08); font-size: 12.5px; font-weight: 700; color: #16245e;"><span>HR / Compensation</span><span style="font-weight: 500; color: #5d6b8f;">1 of 2</span></div>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" checked="true" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">View employee salaries and raise history</span><span style="font-size: 12px; color: #8f9cc2;">hr.salary.read</span></span></label>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">Update salaries and record pay changes</span><span style="font-size: 12px; color: #8f9cc2;">hr.salary.write · includes hr.salary.read</span></span></label>
          
        
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #f7f9ff; border-bottom: 1px solid rgba(32,86,232,.08); font-size: 12.5px; font-weight: 700; color: #16245e;"><span>HR / Employee bank details</span><span style="font-weight: 500; color: #5d6b8f;">1 of 3</span></div>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" checked="true" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">View employee bank account details</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee_bank_account.read</span></span></label>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">Create and update employee bank account details</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee_bank_account.write</span></span></label>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">Reveal unmasked employee IBAN</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee_bank_account.reveal</span></span></label>
          
        
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #f7f9ff; border-bottom: 1px solid rgba(32,86,232,.08); font-size: 12.5px; font-weight: 700; color: #16245e;"><span>HR / Documents</span><span style="font-weight: 500; color: #5d6b8f;">0 of 2</span></div>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">View employee documents</span><span style="font-size: 12px; color: #8f9cc2;">hr.employee_document.read</span></span></label>
          
            <label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid rgba(32,86,232,.06);"><input type="checkbox" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #2056e8;"><span><span style="display: block; font-size: 13.5px; color: #16245e;">View company documents</span><span style="font-size: 12px; color: #8f9cc2;">hr.company_document.read</span></span></label>
          
        
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="Sys-Roles.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="Sys-Roles.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Save role</a>
    </div>
  </div>
</div>
</body>
</html>
