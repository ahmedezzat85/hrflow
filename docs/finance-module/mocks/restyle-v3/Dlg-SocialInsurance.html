<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Social insurance (approved reference, restyle v3)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="dTitle" style="width: 520px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #e0f4f1; color: #0b7a6d; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg></span>
      <div style="flex: 1;"><h2 id="dTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Social insurance · Sarah Connor</h2><div style="font-size: 12.5px; color: #5d6b8f;">Coverage and the effective-dated insured base</div></div>
      <a href="HR-EmployeeDetail.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px;">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #f7f9ff; font-weight: 600; color: #16245e;">Covered by social insurance<input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #2056e8;"></label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Insured base<span style="display: flex;"><span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; background: #f7f9ff; color: #4b5c92; font-size: 13px;">EGP</span><input value="9,400.00" aria-label="Insured base in EGP" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; font-weight: 600; text-align: right; color: #16245e;"></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Effective from<input value="1 Jan 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="HR-EmployeeDetail.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="HR-EmployeeDetail.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Save</a>
    </div>
  </div>
</div>
</body>
</html>
