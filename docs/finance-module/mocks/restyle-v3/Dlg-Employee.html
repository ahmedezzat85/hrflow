<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Add employee (approved reference, restyle v3)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="dTitle" style="width: 680px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #e8eeff; color: #1a46bd; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"></path></svg></span>
      <div style="flex: 1;"><h2 id="dTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Add employee</h2><div style="font-size: 12.5px; color: #5d6b8f;">Creates the employee record and lets them sign in</div></div>
      <a href="HR-Employees.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 13px; font-weight: 700; color: #16245e;">Basic details</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Full name<input placeholder="Laila Hassan" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Work email<input placeholder="laila@voyance.com" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Department<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Engineering</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Job title<input placeholder="Senior Developer" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
      </div>
      <div style="font-size: 13px; font-weight: 700; color: #16245e;">Pay and employment</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Internal salary<span style="display: flex;"><span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 9px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; background: #f7f9ff; color: #4b5c92; font-size: 12.5px;">USD</span><input placeholder="1,000" aria-label="Internal salary in USD" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right;"></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">External salary<span style="display: flex;"><span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 9px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; background: #f7f9ff; color: #4b5c92; font-size: 12.5px;">USD</span><input value="0" aria-label="External salary in USD" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right; color: #16245e;"></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Join date<input placeholder="Pick a date" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Status<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Active</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Employment<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Full-time</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Vacation days a year<input value="21" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #f7f9ff; border: 1px solid rgba(32,86,232,.10);">
        <div><div style="font-size: 13px; font-weight: 700; color: #16245e;">Salary payment docs</div><div style="font-size: 12.5px; color: #5d6b8f;">Only needed when the employee has an external USD salary</div></div>
        <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px 16px;">
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Doc ID, 01–99<input placeholder="02" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff;"></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Address line 1<input placeholder="15 Example Street" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff;"></label>
          <span></span>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Address line 2<input placeholder="New Cairo, Cairo Governorate" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff;"></label>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="HR-Employees.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="HR-EmployeeDetail.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Save employee</a>
    </div>
  </div>
</div>
</body>
</html>
