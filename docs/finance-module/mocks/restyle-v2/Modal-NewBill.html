<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: New bill (approved reference, restyle v2)</title>
<!-- Approved reference for docs/finance-module/21-finance-ui-restyle-v2.md. Static export of the owner-approved canvas board. Do not edit; change the plan instead. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="nbTitle" style="width: 700px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: rgba(224,112,31,.14); color: #b2560f; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M12 12v5M9.5 14.5h5"></path></svg></span>
      <div style="flex: 1;"><h2 id="nbTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">New bill</h2><div style="font-size: 12.5px; color: #5d6b8f;">Record a bill received from a vendor</div></div>
      <a href="Color-Bills.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 16px;">
      <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1.5px dashed rgba(32,86,232,.25); border-radius: 11px; background: #f7f9ff; color: #4b5c92; font-size: 13px; text-align: left;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2056e8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5 12.6 20.9a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"></path></svg><span style="flex: 1;"><strong style="color: #16245e;">Attach bill PDF or photo</strong> · optional, fills the fields for you</span><span style="color: #2056e8; font-weight: 600;">Browse</span></button>
      <div>
        <h3 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #16245e;">Bill details</h3>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px;">
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Vendor<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Amazon Web Services</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Bill number<input placeholder="Blank = numbered EXP-2610-0001" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Category<span style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; font-weight: 400; color: #16245e;"><span style="width: 9px; height: 9px; border-radius: 3px; background: #1b8fd0;"></span>Infrastructure</span></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Bill date<input value="1 Oct 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Amount<span style="display: flex;"><select aria-label="Currency" style="height: 36px; width: 78px; padding: 0 8px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; font-size: 14px; background: #f7f9ff; color: #16245e;"><option>USD</option></select><input value="4,200.00" aria-label="Amount" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right; font-weight: 600; color: #16245e;"></span></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Due date<input value="31 Oct 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
        </div>
      </div>
      <div>
        <h3 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #16245e;">Payment</h3>
        <div role="group" aria-label="Payment" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px;">
          <button type="button" aria-pressed="false" style="height: 36px; border-radius: 10px; border: 1px solid rgba(32,86,232,.18); background: #fff; color: #4b5c92; font-size: 13px; font-weight: 600;">Not paid yet</button>
          <button type="button" aria-pressed="true" style="height: 36px; border-radius: 10px; border: 1.5px solid #2056e8; background: #e8eeff; color: #1a46bd; font-size: 13px; font-weight: 600;">Already paid</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 12px; border-radius: 12px; background: #f7f9ff; border: 1px solid rgba(32,86,232,.10);">
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Paid from (bill currency)<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Voyance Operating USD · 145,800.00</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Payment type<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Outgoing transfer</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Reference<input placeholder="Receipt, transfer or cheque no." style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff;"></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Details<input value="Amazon Web Services" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"></label>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; border-radius: 11px; background: rgba(32,86,232,.08); font-size: 13px; color: #16245e;">Saves as <span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #06703f; background: #e3f5ec;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #06703f;"></span>Paid</span> and posts <strong>$4,200.00</strong> out of Voyance Operating USD.</div>
      <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none;">More fields · legal entity, cost centre, notes ▾</a>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <span style="display: flex; align-items: center; gap: 14px;"><a href="Color-Bills.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(32,86,232,.22); background: #fff; color: #1a46bd; font-weight: 600; font-size: 13px; text-decoration: none;">Save as draft</a><label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #4b5c92;"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: #2056e8;">Add another after saving</label></span>
      <span style="display: flex; gap: 8px;"><a href="Color-Bills.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a><a href="Color-Bills.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Save &amp; record payment</a></span>
    </div>
  </div>
</div>
</body>
</html>
