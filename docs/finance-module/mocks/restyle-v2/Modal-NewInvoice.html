<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: New sales invoice (approved reference, restyle v2)</title>
<!-- Approved reference for docs/finance-module/21-finance-ui-restyle-v2.md. Static export of the owner-approved canvas board. Do not edit; change the plan instead. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="niTitle" style="width: 760px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: rgba(15,157,140,.14); color: #0b7a6d; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"></path></svg></span>
      <div style="flex: 1;"><h2 id="niTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">New sales invoice</h2><div style="font-size: 12.5px; color: #5d6b8f;">Customer, currency, number, date and lines lock once it is sent</div></div>
      <a href="Color-Invoices.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 14px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92; grid-column: span 2;">Customer<span style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 8px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; font-weight: 400; color: #16245e;"><span style="width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; background: rgba(185,128,0,.14); color: #8a6000;">EC</span>Echo Clinics · Net 30</span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Invoice number<input value="INV-2026-005" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Issue date<input value="1 Oct 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Due date<input value="31 Oct 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Currency<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>EGP</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Receiving account<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>CIB EGP Operating</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Revenue channel<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Local EGP</option></select></label>
        <span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">VAT %<input value="14" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e; min-width: 0;"></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">WHT %<input value="0" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e; min-width: 0;"></label>
        </span>
      </div>

      <div style="border: 1px solid rgba(32,86,232,.12); border-radius: 12px; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13.5px;">
          <thead>
            <tr>
              <th scope="col" style="text-align: left; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #4b5c92; border-bottom: 1px solid rgba(32,86,232,.12);">Line</th>
              <th scope="col" style="text-align: right; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #4b5c92; border-bottom: 1px solid rgba(32,86,232,.12); width: 70px;">Qty</th>
              <th scope="col" style="text-align: right; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #4b5c92; border-bottom: 1px solid rgba(32,86,232,.12); width: 110px;">Unit price</th>
              <th scope="col" style="text-align: right; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #4b5c92; border-bottom: 1px solid rgba(32,86,232,.12); width: 120px;">Total</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="padding: 8px 12px; border-bottom: 1px solid rgba(32,86,232,.07); color: #16245e;">Teleradiology reads, September 2026</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid rgba(32,86,232,.07); text-align: right;">120</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid rgba(32,86,232,.07); text-align: right;">250.00</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid rgba(32,86,232,.07); text-align: right; font-weight: 600; color: #16245e;">30,000.00</td>
            </tr>
          </tbody>
        </table>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f7f9ff;">
          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(32,86,232,.22); background: #fff; color: #1a46bd; font-weight: 600; font-size: 12.5px;">Add line</button>
          <span style="display: flex; gap: 18px; font-size: 13px; color: #4b5c92;"><span>Subtotal <strong style="color: #16245e;">30,000.00</strong></span><span>VAT 14% <strong style="color: #16245e;">4,200.00</strong></span><span>Total <strong style="color: #16245e; font-size: 15px;">EGP 34,200.00</strong></span></span>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Notes<textarea rows="2" placeholder="Optional notes for this invoice" style="padding: 8px 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; resize: none;"></textarea></label>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="Color-Invoices.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(32,86,232,.22); background: #fff; color: #1a46bd; font-weight: 600; font-size: 13px; text-decoration: none;">Save as draft</a>
      <span style="display: flex; gap: 8px;"><a href="Color-Invoices.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a><a href="Color-Invoices.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Save &amp; send</a></span>
    </div>
  </div>
</div>
</body>
</html>
