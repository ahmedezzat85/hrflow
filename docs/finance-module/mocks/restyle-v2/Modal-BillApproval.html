<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Bill approval (approved reference, restyle v2)</title>
<!-- Approved reference for docs/finance-module/21-finance-ui-restyle-v2.md. Static export of the owner-approved canvas board. Do not edit; change the plan instead. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="baTitle" style="width: 600px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: rgba(240,146,40,.14); color: #9c5000; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
      <div style="flex: 1;"><h2 id="baTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Review bill</h2><div style="font-size: 12.5px; color: #5d6b8f;">Approve or reject before it can be paid</div></div>
      <a href="Color-Bills.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #f7f9ff; border: 1px solid rgba(32,86,232,.10);">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: rgba(224,112,31,.14); color: #b2560f;">AW</span>
        <div style="flex: 1;"><div style="font-weight: 600; color: #16245e;">Amazon Web Services</div><div style="font-size: 12.5px; color: #5d6b8f;"><span style="color: #2056e8; font-weight: 600;">BILL-2026-005</span> · <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; border-radius: 3px; background: #1b8fd0;"></span>Infrastructure</span> · 9 Sep 2026</div></div>
        <div style="text-align: right;"><div style="font-family: Sora, sans-serif; font-weight: 700; font-size: 22px; color: #16245e;">$8,900.00</div><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #9c5000; background: #fdf0e1;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #9c5000;"></span>Pending approval</span></div>
      </div>
      <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none;">View attached bill (PDF) ›</a>
      <div>
        <h3 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; color: #16245e;">Decision</h3>
        <div role="group" aria-label="Decision" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <button type="button" aria-pressed="true" style="height: 38px; border-radius: 10px; border: 1.5px solid #06703f; background: #e3f5ec; color: #06703f; font-size: 13px; font-weight: 600;">Approve</button>
          <button type="button" aria-pressed="false" style="height: 38px; border-radius: 10px; border: 1px solid rgba(32,86,232,.18); background: #fff; color: #4b5c92; font-size: 13px; font-weight: 600;">Reject</button>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Comment (required to reject)<textarea rows="3" placeholder="Visible to the person who recorded the bill" style="padding: 8px 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; resize: none;"></textarea></label>
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 11px; background: rgba(32,86,232,.08); font-size: 13px; color: #16245e;">After approval the bill moves to <span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #1a46bd; background: #e8eeff;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1a46bd;"></span>Approved</span> and can be paid or scheduled.</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="Color-Bills.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="Modal-PayBill.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Approve bill</a>
    </div>
  </div>
</div>
</body>
</html>
