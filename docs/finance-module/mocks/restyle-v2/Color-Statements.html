        <thead>
          <tr>
            <th scope="col" style="text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #2056e8; border-bottom: 1px solid rgba(32,86,232,.12);">Period ↓</th>

          </tr>
        </thead>
        <tbody>

            <td style="padding: 11px 16px; border-bottom: 1px solid rgba(32,86,232,.07);"><span style="display: flex; align-items: center; gap: 10px;"><span style="width: 32px; height: 32px; flex: none; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: rgba(27,143,208,.14); color: #146fa3;">VO</span><span><span style="display: block; font-weight: 600; color: #16245e;">Sep 2026</span><span style="font-size: 12px; color: #5d6b8f;">Voyance Operating USD</span></span></span></td>
            <td style="padding: 11px 12px; border-bottom: 1px solid rgba(32,86,232,.07);">CSV<div style="font-size: 12px; color: #5d6b8f;">3 lines</div></td>
            <td style="padding: 11px 12px; border-bottom: 1px solid rgba(32,86,232,.07);"><div style="display: flex; align-items: center; gap: 8px;"><span style="width: 90px; height: 6px; border-radius: 999px; background: #efe9fd; overflow: hidden; display: inline-block;"><span style="display: block; width: 33%; height: 100%; background: #7c4ddb; border-radius: 999px;"></span></span><span style="font-weight: 600; color: #16245e;">1 of 3</span></div><div style="font-size: 12px; color: #5d6b8f;">2 lines to match</div></td>
            <td style="padding: 11px 12px; border-bottom: 1px solid rgba(32,86,232,.07);"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #9c5000; background: #fdf0e1;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #9c5000;"></span>Needs review</span></td>
            <td style="padding: 11px 12px; border-bottom: 1px solid rgba(32,86,232,.07); white-space: nowrap;">10 Sep 2026</td>
            <td style="padding: 11px 16px; border-bottom: 1px solid rgba(32,86,232,.07); text-align: right; white-space: nowrap;"><a href="Color-Ledger.html" style="display: inline-flex; align-items: center; box-sizing: border-box; height: 28px; padding: 0 12px; border-radius: 8px; background: #2056e8; color: #fff; font-weight: 600; font-size: 12.5px; vertical-align: middle; text-decoration: none;">Reconcile</a><button type="button" aria-label="View Sep 2026 statement" title="View Sep 2026 statement" style="width:30px;height:30px;margin-left:2px;border:0;border-radius:8px;background:transparent;color:#5d6b8f;display:inline-grid;place-items:center;vertical-align:middle;cursor:pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button type="button" aria-label="Edit Sep 2026 statement" title="Edit Sep 2026 statement" style="width:30px;height:30px;margin-left:2px;border:0;border-radius:8px;background:transparent;color:#5d6b8f;display:inline-grid;place-items:center;vertical-align:middle;cursor:pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button></td>
