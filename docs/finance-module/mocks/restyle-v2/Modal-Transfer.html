<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog: Transfer between accounts (approved reference, restyle v2)</title>
<!-- Approved reference for docs/finance-module/21-finance-ui-restyle-v2.md. Static export of the owner-approved canvas board. Do not edit; change the plan instead. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700&amp;display=swap">
<style>body{margin:0}button,input,select,textarea{font-family:inherit}a{color:#2056e8}a:hover{color:#1a46bd}</style>
</head>
<body>
<div style="width: 1140px; height: 860px; box-sizing: border-box; background: rgba(22,36,94,.42); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #2b3a5c; display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="tfTitle" style="width: 720px; background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,30,80,.28); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid rgba(32,86,232,.08);">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: rgba(27,143,208,.14); color: #146fa3; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg></span>
      <div style="flex: 1;"><h2 id="tfTitle" style="margin: 0; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; color: #16245e;">Transfer between accounts</h2><div style="font-size: 12.5px; color: #5d6b8f;">The only way money changes currency (exchange)</div></div>
      <a href="Color-Transfers.html" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: #4b5c92; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: grid; grid-template-columns: 1fr 40px 1fr; gap: 10px; align-items: stretch;">
        <div style="padding: 12px; border-radius: 14px; border: 1px solid rgba(224,112,31,.30); background: rgba(224,112,31,.05); display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 12px; font-weight: 700; color: #b2560f;">↑ FROM</span>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Account<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Voyance Operating USD</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Amount out<span style="display: flex;"><span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; background: #fff; color: #4b5c92; font-size: 13px;">USD</span><input value="50,000.00" aria-label="Amount out" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right; font-weight: 600; color: #16245e;"></span></label>
          <span style="font-size: 12px; color: #5d6b8f;">Balance after: $95,800.00</span>
        </div>
        <span style="display: flex; align-items: center; justify-content: center; color: #2056e8; font-size: 22px; font-weight: 700;" aria-hidden="true">→</span>
        <div style="padding: 12px; border-radius: 14px; border: 1px solid rgba(15,157,140,.30); background: rgba(15,157,140,.05); display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 12px; font-weight: 700; color: #0b7a6d;">↓ TO</span>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Account<select style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; background: #fff; color: #16245e;"><option>Voyance Treasury Reserve</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Amount in<span style="display: flex;"><span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-right: 0; border-radius: 9px 0 0 9px; background: #fff; color: #4b5c92; font-size: 13px;">USD</span><input value="50,000.00" aria-label="Amount in" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right; font-weight: 600; color: #16245e;"></span></label>
          <span style="font-size: 12px; color: #5d6b8f;">Same currency, no exchange rate</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Transfer fee<input value="0.00" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; text-align: right; color: #16245e;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Sent on<input value="12 Sep 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Expected arrival<input value="14 Sep 2026" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span id="tfPost" style="font-size: 12.5px; font-weight: 600; color: #4b5c92;">Post now</span>
        <div role="group" aria-labelledby="tfPost" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
          <button type="button" aria-pressed="false" style="height: 36px; border-radius: 9px; border: 1px solid rgba(32,86,232,.18); background: #fff; color: #4b5c92; font-size: 12.5px; font-weight: 600;">Both sides</button>
          <button type="button" aria-pressed="true" style="height: 36px; border-radius: 9px; border: 1.5px solid #2056e8; background: #e8eeff; color: #1a46bd; font-size: 12.5px; font-weight: 600;">Out now, in later</button>
          <button type="button" aria-pressed="false" style="height: 36px; border-radius: 9px; border: 1px solid rgba(32,86,232,.18); background: #fff; color: #4b5c92; font-size: 12.5px; font-weight: 600;">In only, match later</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Bank reference<input placeholder="Wire or exchange ref" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px;"></label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: #4b5c92;">Memo<input value="Move surplus to reserve" style="height: 36px; padding: 0 10px; border: 1px solid rgba(32,86,232,.18); border-radius: 9px; font-size: 14px; color: #16245e;"></label>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid rgba(32,86,232,.08); background: #fbfcff;">
      <a href="Color-Transfers.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: #4b5c92; font-weight: 600; font-size: 13px; text-decoration: none;">Cancel</a>
      <a href="Color-Transfers.html" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: #2056e8; color: #fff; font-weight: 600; font-size: 13px; text-decoration: none;">Record transfer</a>
    </div>
  </div>
</div>
</body>
</html>
