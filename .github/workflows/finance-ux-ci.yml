name: Finance UX CI

on:
  push:
    branches: [main]
  # No path filters: these jobs are required checks for pull requests, so they must run for every PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-ux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the frontend jobs are needed. Only pull requests can skip them, and only when no file under fe/
    # or .github/ changed (the UI tests run against the mock API, so backend-only changes cannot affect them).
    # Every push to main and every manual run always runs everything: the release gate requires the frontend checks
    # on the commit it tags to be "success", and a skipped job is not.
    name: Detect UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "Not a pull request: run the frontend checks"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(fe/|\.github/)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "UI files changed: run the frontend checks"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"; echo "No UI files changed: frontend checks are skipped"
          fi

  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: be
    env:
      DB_TYPE: sqlite
      DATABASE_URL: sqlite:///./ci.db
      ENVIRONMENT: development
      SECRET_KEY: ci-only-secret-not-for-production
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Migrations first: importing main runs init_db(), which would pre-create the tables.
      - name: Verify Alembic migrations (fresh database)
        run: alembic upgrade head

      - name: Verify application imports
        run: python -c "import main; print('Backend import OK')"

      # Every test builds its own temporary database, so the suite runs in parallel (pytest-xdist). The latency
      # benchmark asserts wall-clock limits, which parallel load can break, so it runs alone in the next step.
      - name: Run backend test suite (parallel)
        run: python -m pytest -ra -n auto --deselect tests/test_rbac.py::test_rbac_latency_benchmark --junitxml=pytest-results.xml

      - name: Run latency benchmark (alone)
        run: python -m pytest -ra tests/test_rbac.py::test_rbac_latency_benchmark --junitxml=pytest-benchmark-results.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            be/pytest-results.xml
            be/pytest-benchmark-results.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend-tests:
    # The UI suite is the slow part (about 10 minutes on one runner), so it is split into 4 shards that run at the same
    # time. The three required check names are unchanged: "Frontend build and tests (Node 22)" below waits for every
    # shard, and the quality gate fails if any shard fails.
    name: Frontend UI tests (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chrome
        # The GitHub runner image already ships Google Chrome, and the apt download that "--with-deps" does was
        # sometimes extremely slow (one shard spent 9 minutes on it, the tests themselves took 3). Use the installed
        # Chrome when it is there. Otherwise install it, retrying: the browser download occasionally drops
        # mid-transfer (curl 92 / INTERNAL_ERROR); a persistent outage still fails the step.
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            /opt/google/chrome/chrome --version
            echo "Google Chrome is already installed: skipping the Playwright install"
            exit 0
          fi
          for attempt in 1 2 3; do
            npx playwright install --with-deps chrome && exit 0
            echo "Playwright Chrome install failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Create CI runtime config
        run: |
          cat > config.js <<'EOF'
          window.HRFLOW_CONFIG = {
            API_BASE_URL: "http://localhost:5000",
            GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
          };
          EOF

      - name: Run frontend tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: fe/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend build and tests (Node 22)
    needs: [changes, frontend-tests]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Create CI runtime config
        run: |
          cat > config.js <<'EOF'
          window.HRFLOW_CONFIG = {
            API_BASE_URL: "http://localhost:5000",
            GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
          };
          EOF

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: fe/dist
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Finance UX quality gate
    if: always()
    needs: [changes, backend, frontend-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce successful verification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UI_CHANGED: ${{ needs.changes.outputs.ui }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "Backend: $BACKEND_RESULT"
          echo "Frontend UI tests: $FRONTEND_TESTS_RESULT"
          echo "Frontend: $FRONTEND_RESULT"
          test "$CHANGES_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          if [ "$UI_CHANGED" = "true" ]; then
            test "$FRONTEND_TESTS_RESULT" = "success"
            test "$FRONTEND_RESULT" = "success"
          else
            # A pull request with no UI changes skips the frontend jobs on purpose.
            test "$FRONTEND_TESTS_RESULT" = "skipped"
            test "$FRONTEND_RESULT" = "skipped"
          fi
