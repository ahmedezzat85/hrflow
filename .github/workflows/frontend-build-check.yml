name: Frontend build & smoke test

on:
  push:
    branches: [refactor/frontend-modular]
    paths: ['fe/**', '.github/workflows/frontend-build-check.yml']
  pull_request:
    paths: ['fe/**', '.github/workflows/frontend-build-check.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create dummy config.js (not committed - CI only)
        run: |
          cat > fe/config.js <<'EOF'
          window.HRFLOW_CONFIG = {
            API_BASE_URL: "http://localhost:5000",
            GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com",
          };
          EOF

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Assemble servable preview (dist output + real config/api/assets)
        run: |
          cp fe/dist/index.html fe/_ci_preview.html

      - name: Upload servable fe/ directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-preview
          path: |
            fe
            !fe/node_modules
            !fe/src
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download servable fe/ artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-preview
          path: fe

      - name: Set up smoke-test tooling (local, not global)
        run: |
          mkdir -p ci-smoke-test
          cd ci-smoke-test
          npm init -y > /dev/null
          npm install playwright http-server
          npx playwright install --with-deps chromium

      - name: Serve fe/ as site root (matches real deployment layout)
        run: |
          cd ci-smoke-test
          npx http-server ../fe -p 4173 -s &
          sleep 2

      - name: Run headless console-error check
        working-directory: ci-smoke-test
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const errors = [];
          const browser = await chromium.launch();
          const page = await browser.newPage();

          page.on('console', (msg) => {
            if (msg.type() === 'error') errors.push(`[console.error] ${msg.text()}`);
          });
          page.on('pageerror', (err) => {
            errors.push(`[uncaught exception] ${err.message}`);
          });
          page.on('requestfailed', (req) => {
            errors.push(`[network] Failed to load: ${req.url()} (${req.failure()?.errorText || 'unknown'})`);
          });

          await page.goto('http://localhost:4173/_ci_preview.html', { waitUntil: 'networkidle', timeout: 15000 });
          await page.waitForTimeout(2000);

          const loginScreenVisible = await page.locator('#login-screen').isVisible().catch(() => false);
          if (!loginScreenVisible) {
            errors.push('[assertion] #login-screen was not visible after load - app failed to boot correctly');
          }

          await browser.close();

          if (errors.length > 0) {
            console.error('Smoke test FAILED. Console errors / assertion failures found:\n');
            errors.forEach((e) => console.error(e));
            process.exit(1);
          } else {
            console.log('Smoke test PASSED: no console errors, login screen rendered correctly.');
          }
          EOF
          node smoke.mjs
