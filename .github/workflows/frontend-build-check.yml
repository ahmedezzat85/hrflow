name: Frontend build & smoke test

on:
  push:
    branches: [refactor/frontend-modular]
    paths: ['fe/**', '.github/workflows/frontend-build-check.yml']
  pull_request:
    paths: ['fe/**', '.github/workflows/frontend-build-check.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create dummy config.js (not committed - CI only)
        run: |
          cat > fe/config.js <<'EOF'
          window.HRFLOW_CONFIG = {
            API_BASE_URL: "http://localhost:5000",
            GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com",
          };
          EOF

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: fe/dist
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: fe/dist

      - name: Install Playwright + http-server
        run: npm install -g playwright http-server && npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          npx http-server fe/dist -p 4173 -s &
          sleep 2

      - name: Run headless console-error check
        run: |
          cat > /tmp/smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const errors = [];
          const browser = await chromium.launch();
          const page = await browser.newPage();

          page.on('console', (msg) => {
            if (msg.type() === 'error') errors.push(`[console.error] ${msg.text()}`);
          });
          page.on('pageerror', (err) => {
            errors.push(`[uncaught exception] ${err.message}`);
          });

          await page.goto('http://localhost:4173', { waitUntil: 'networkidle', timeout: 15000 });
          await page.waitForTimeout(2000);

          const loginScreenVisible = await page.locator('#login-screen').isVisible().catch(() => false);
          if (!loginScreenVisible) {
            errors.push('[assertion] #login-screen was not visible after load - app failed to boot correctly');
          }

          await browser.close();

          if (errors.length > 0) {
            console.error('Smoke test FAILED. Console errors / assertion failures found:\n');
            errors.forEach((e) => console.error(e));
            process.exit(1);
          } else {
            console.log('Smoke test PASSED: no console errors, login screen rendered correctly.');
          }
          EOF
          node /tmp/smoke.mjs
