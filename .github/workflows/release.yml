name: Release

# One click: tag the latest main with the next version and deploy it to production.
#   gh workflow run release.yml -f bump=patch          (or GitHub > Actions > Release > Run workflow)
# It waits for the required checks on the latest main, creates the next vX.Y.Z tag, then starts "Deploy production" for
# that tag. The deploy itself (backup, build, migrations, health check, automatic rollback) is unchanged.
# A dry run only prints the version it would create and the state of the checks; it creates no tag and deploys nothing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increase (patch: fixes, minor: new features, major: breaking changes)'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Only show the version that would be released; do not tag or deploy'
        type: boolean
        default: false

# contents: write creates the tag. actions: write starts "Deploy production" (a tag pushed with the built-in token
# does not start other workflows, so the deploy is started explicitly). checks: read reads the required checks.
permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag the latest main and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: A real release must be started from main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Start the Release workflow from the main branch (it is on $GITHUB_REF). A dry run can start anywhere."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the next version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags --force
          SHA=$(git rev-parse HEAD)
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LAST=${LAST:-v0.0.0}
          if [ "$LAST" != "v0.0.0" ] && [ "$(git rev-parse "refs/tags/$LAST^{commit}")" = "$SHA" ]; then
            echo "Nothing to release: the latest main ($SHA) is already tagged $LAST."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          NEXT="v$MAJOR.$MINOR.$PATCH"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then echo "$NEXT already exists"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Latest main: $SHA. Last release: $LAST. Next release: $NEXT ($BUMP)."

      - name: Wait for the required checks on the latest main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          # The same three checks "Deploy production" requires. Checks run on every push to main, so right after a
          # merge they may still be running: wait for them (up to 35 minutes) instead of failing.
          REQUIRED=("Backend tests (Python 3.12)" "Frontend build and tests (Node 22)" "Finance UX quality gate")
          DEADLINE=$((SECONDS + 2100))
          while true; do
            gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' > checks.tsv
            PENDING=0
            for name in "${REQUIRED[@]}"; do
              LINE=$(grep -F "$name	" checks.tsv | tail -1 || true)
              STATUS=$(echo "$LINE" | cut -f2); CONCLUSION=$(echo "$LINE" | cut -f3)
              if [ -z "$LINE" ] || [ "$STATUS" != "completed" ]; then PENDING=1; echo "waiting: $name (${STATUS:-not started})"
              elif [ "$CONCLUSION" != "success" ]; then echo "FAILED: $name ($CONCLUSION) on $SHA. Fix main before releasing."; exit 1
              else echo "ok: $name"; fi
            done
            [ "$PENDING" = 0 ] && break
            [ $SECONDS -ge $DEADLINE ] && { echo "Timed out waiting for the required checks on $SHA."; exit 1; }
            sleep 30
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN: would tag ${{ steps.v.outputs.sha }} as ${{ steps.v.outputs.next }} (last release ${{ steps.v.outputs.last }}) and deploy it. Nothing was created."
          echo "Dry run: would release **${{ steps.v.outputs.next }}** (last: ${{ steps.v.outputs.last }}) from \`${{ steps.v.outputs.sha }}\`. Nothing was tagged or deployed." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.v.outputs.next }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          # Never move main under the release: tag exactly the commit that was checked.
          git fetch origin main
          [ "$(git rev-parse origin/main)" = "$SHA" ] || { echo "main moved while waiting; run Release again."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" "$SHA" -m "Release $NEXT"
          git push origin "refs/tags/$NEXT"

      - name: Start "Deploy production" for the tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.v.outputs.next }}
        run: |
          gh workflow run deploy-prod.yml --repo "${{ github.repository }}" --ref main -f version="$NEXT"
          echo "Released **$NEXT**. Follow the deployment under Actions > Deploy production." >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged $NEXT and started Deploy production."
