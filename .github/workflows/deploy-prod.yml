name: Deploy production

# Deploys a release tag (v1.2.3) to the production stack on the self-hosted runner (the PC that runs HRFlow).
# Runs only for tags or a manual start; pull requests and branch pushes never reach the runner.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to deploy or roll back to (e.g. v1.0.1)'
        required: true

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then echo "Invalid version: $VERSION"; exit 1; fi
          git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "refs/tags/$VERSION^{commit}")" >> "$GITHUB_OUTPUT"

      - name: The tagged commit must come from main
        env:
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$VERSION is not on main; refusing to deploy"; exit 1; }
          # A new release (tag push) must be the latest main, i.e. the result of the last accepted pull request.
          # Re-deploying or rolling back to an older release tag is only possible by starting the workflow by hand.
          if [ "$EVENT" = "push" ]; then
            [ "$SHA" = "$(git rev-parse origin/main)" ] || { echo "$VERSION is not the latest main ($(git rev-parse --short origin/main)); tag the latest main"; exit 1; }
          fi

      - name: The tagged commit must have passed the required checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | [.name, .conclusion] | @tsv' > checks.tsv
          cat checks.tsv
          for name in "Backend tests (Python 3.12)" "Frontend build and tests (Node 22)" "Finance UX quality gate"; do
            grep -Fq "$name	success" checks.tsv || { echo "Required check not green for $SHA: $name"; exit 1; }
          done

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: [self-hosted, windows, hrflow-prod]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify.outputs.version }}

      - name: Backup, build, start, health check (rolls back on failure)
        # Same command GitHub uses for "powershell", plus -ExecutionPolicy Bypass for this one process only. Windows
        # defaults to "Restricted", which refused to run the job script ("running scripts is disabled on this system")
        # when the runner was started outside the usual context. No machine setting is changed.
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          & ./deploy/prod/scripts/deploy.ps1 -Version $env:VERSION
          exit $LASTEXITCODE
