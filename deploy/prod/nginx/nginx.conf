worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    client_max_body_size 25m;

    # Rate limiting: strict for the login endpoint, generous for general API use.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Honour X-Forwarded-Proto from an upstream TLS terminator (e.g. Cloudflare Tunnel).
    map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

    upstream hrflow_app { server app:8000; keepalive 16; }

    server {
        listen 80;
        server_name _;

        location = /nginx-health { access_log off; return 200 "ok"; }

        # Client-side demo/mock mode must not be reachable in production.
        if ($arg_mock) { return 302 /; }

        location = /api/auth/google {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://hrflow_app;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://hrflow_app;
            proxy_read_timeout 120s;
        }

        # Static frontend (security headers are added here; API responses carry the backend's own headers).
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
