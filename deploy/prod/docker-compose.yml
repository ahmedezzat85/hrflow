# HRFlow production stack. Run from the repo root with the external env file:
#   docker compose --env-file D:/services/hrflow-prod/.env -f deploy/prod/docker-compose.yml up -d --build
# D:/services/hrflow-prod/.env is the single source of configuration (template: .env.prod.example at the repo root).
name: hrflow-prod

services:
  postgres:
    image: hrflow-postgres:${HRFLOW_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_NAME: ${POSTGRES_DB:-hrflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${APP_DB_USER} -d $${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { memory: 1g }

  app:
    image: hrflow-app:${HRFLOW_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    # Every setting the backend reads (be/config.py) is passed through from the host .env, with the
    # same default config.py uses. Only values that describe the container itself are fixed here
    # (marked "fixed by container"); they are listed in .env.prod.example for visibility.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Authentication
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      TOKEN_EXPIRY_HOURS: ${TOKEN_EXPIRY_HOURS:-12}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hrflow_session}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID}
      ALLOWED_WORKSPACE_DOMAIN: ${ALLOWED_WORKSPACE_DOMAIN:?set ALLOWED_WORKSPACE_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      # Database (fixed by container: the PostgreSQL service is "postgres" on the internal network)
      STORAGE_ENGINE: sql
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrflow}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      # Files (fixed by container: paths inside the container, mapped to the host by the volumes below)
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      HRFLOW_FILES_ROOT: /data/documents
      BILL_UPLOADS_DIR: /data/documents/finance_bills          # legacy fallback
      FINANCE_UPLOADS_DIR: /data/documents/finance_attachments  # legacy fallback
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}
      # Google service account (fixed by container: mounted read-only from ${HRFLOW_DATA_DIR}/secrets)
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google-credentials.json
      SPREADSHEET_ID: ${SPREADSHEET_ID:-}
      SHEETS_CACHE_TTL_SECONDS: ${SHEETS_CACHE_TTL_SECONDS:-30}
      # Finance
      ENFORCE_MAKER_CHECKER: ${ENFORCE_MAKER_CHECKER:-true}
      INVOICE_TEMPLATE_PATH: /app/templates/us_invoice_template.docx  # fixed by container (baked into the image)
      INVOICE_TEMPLATE_VERSION: ${INVOICE_TEMPLATE_VERSION:-v1}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: /data/logs/hrflow.log
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - ${HRFLOW_DATA_DIR:?set HRFLOW_DATA_DIR}/documents:/data/documents
      - ${HRFLOW_DATA_DIR}/logs:/data/logs
      - ${HRFLOW_DATA_DIR}/secrets:/run/secrets:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 1g }

  web:
    image: hrflow-web:${HRFLOW_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.web
    # The browser config (config.js) is generated from these at container start, so the same image
    # works on any host. An empty API base URL means same-origin (/api is proxied by this nginx).
    environment:
      HRFLOW_API_BASE_URL: ${HRFLOW_API_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID}
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HRFLOW_HTTP_PORT:-80}:80"
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal: {}

volumes:
  pgdata: {}
