# HRFlow production stack. Run from the repo root with the external env file:
#   docker compose --env-file D:/services/hrflow-prod/.env -f deploy/prod/docker-compose.yml up -d --build
name: hrflow-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_NAME: ${POSTGRES_DB:-hrflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${APP_DB_USER} -d $${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { memory: 1g }

  app:
    image: hrflow-app:${HRFLOW_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      TOKEN_EXPIRY_HOURS: ${TOKEN_EXPIRY_HOURS:-12}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID}
      ALLOWED_WORKSPACE_DOMAIN: ${ALLOWED_WORKSPACE_DOMAIN:?set ALLOWED_WORKSPACE_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      STORAGE_ENGINE: sql
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hrflow}
      FILE_STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/documents
      LOG_FILE_PATH: /data/logs/hrflow.log
      INVOICE_TEMPLATE_PATH: /app/templates/us_invoice_template.docx
    volumes:
      - ${HRFLOW_DATA_DIR:?set HRFLOW_DATA_DIR}/documents:/data/documents
      - ${HRFLOW_DATA_DIR}/logs:/data/logs
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 1g }

  web:
    image: hrflow-web:${HRFLOW_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile.web
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HRFLOW_HTTP_PORT:-80}:80"
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal: {}

volumes:
  pgdata: {}
