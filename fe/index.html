<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRFlow | HR Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="api.js"></script>
<style>
:root{--accent:#6366f1;--accent2:#8b5cf6;--accent-soft:rgba(99,102,241,.12);--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#0ea5e9;--bg:#f4f5fb;--surface:#ffffff;--surface2:#f8f9fd;--border:#e7e9f3;--text:#171a2b;--text2:#6b7280;--text3:#9ca3af;--radius:16px;--radius-sm:10px;--shadow:0 1px 2px rgba(20,20,50,.04),0 8px 24px rgba(20,20,50,.05);--shadow-lg:0 10px 40px rgba(20,20,50,.12);}
[data-theme="dark"]{--bg:#0f1117;--surface:#171a24;--surface2:#1d2130;--border:#2a2e3d;--text:#f1f2f6;--text2:#9aa0b4;--text3:#6b7280;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 10px 40px rgba(0,0,0,.5);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.hidden{display:none !important;}
</style>
</head>
<body>
<p>RESTORATION_IN_PROGRESS_SEE_CHAT</p>
</body>
</html>
