        <section class="page-section" id="a-finance-bills">
          <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <div class="filter-tabs" id="financeBillSubNav" role="tablist" aria-label="Spend sub navigation">
              <!-- rendered by SpendTabs (finance-nav.js) -->
            </div>
            </div>
            <div style="display: flex; gap: 8px;">
              <div class="search-box" id="financeBillSearchBox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeBillSearch" placeholder="Search bills..." aria-label="Search bills" oninput="filterFinanceBills(this.value)">
              </div>
              <div class="search-box" id="financeVendorSearchBox" style="display: none;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeVendorSearch" placeholder="Search vendors..." aria-label="Search vendors" oninput="filterFinanceVendors(this.value)">
              </div>
              <button class="btn btn-outline" id="financeAddVendorBtn" onclick="openAddVendorModal()">Add Vendor</button>
              <button class="btn btn-outline" id="financeUploadDraftsBtn" onclick="document.getElementById('financeBillsUploadInput').click()" title="Upload several PDFs or photos; each becomes its own draft">Upload bills</button>
              <input type="file" id="financeBillsUploadInput" multiple accept=".pdf,image/*" style="display:none" onchange="onBillDraftFilesChosen(this)">
              <button class="btn btn-fill" id="financeRecordBillBtn" onclick="openAddBillModal()">Record Bill</button>
            </div>
          </div>

          <!-- Direction A (D-021): always-visible status row; replaces the FUX-414 pill + Change view panel -->
          <div id="financeBillStatusRow" class="bill-status-row">
            <div class="filter-tabs bill-status-tabs" id="financeBillWorkQueueTabs" role="tablist" aria-label="AP Inbox Queues">
              <button type="button" class="filter-tab active" id="tabBillQueueAll" role="tab" aria-selected="true" onclick="setBillWorkQueue('all')">All <span class="badge badge-grey" id="badgeBillQueueAll">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueueDraft" role="tab" aria-selected="false" onclick="setBillWorkQueue('draft')">Draft <span class="badge badge-grey" id="badgeBillQueueDraft">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueuePendingApproval" role="tab" aria-selected="false" onclick="setBillWorkQueue('pending_approval')">Pending Approval <span class="badge badge-grey" id="badgeBillQueuePendingApproval">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueueRejected" role="tab" aria-selected="false" onclick="setBillWorkQueue('rejected')">Rejected <span class="badge badge-grey" id="badgeBillQueueRejected">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueueApproved" role="tab" aria-selected="false" onclick="setBillWorkQueue('approved')">Approved <span class="badge badge-grey" id="badgeBillQueueApproved">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueueScheduled" role="tab" aria-selected="false" onclick="setBillWorkQueue('scheduled')">Scheduled <span class="badge badge-grey" id="badgeBillQueueScheduled">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueuePartiallyPaid" role="tab" aria-selected="false" onclick="setBillWorkQueue('partially_paid')">Partially Paid <span class="badge badge-grey" id="badgeBillQueuePartiallyPaid">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueuePaid" role="tab" aria-selected="false" onclick="setBillWorkQueue('paid')">Paid <span class="badge badge-grey" id="badgeBillQueuePaid">0</span></button>
              <button type="button" class="filter-tab" id="tabBillQueueVoid" role="tab" aria-selected="false" onclick="setBillWorkQueue('void')">Void <span class="badge badge-grey" id="badgeBillQueueVoid">0</span></button>
            </div>
            <div class="bill-status-row-meta">
              <span id="financeBillViewResultCount">Showing 0 of 0 bills</span>
              <label for="financeBillOverdueOnly" class="bill-overdue-toggle">
                <input type="checkbox" id="financeBillOverdueOnly" onchange="onBillOverdueOnlyChange()"> Overdue only <span class="badge badge-grey" id="financeBillOverdueCount">0</span>
              </label>
            </div>
          </div>

          <!-- 1. Bills Sub-View -->
          <div class="card clean-table-card" id="financeBillsContainer">
            <div class="section-loading-bar" id="financeBillsLoadingBar"><span></span></div>
            <table class="responsive-card-table sticky-actions" id="financeBillsTable">
              <thead>
                <tr>
                  <th data-sort="vendor_name">Bill</th>
                  <th data-sort="issue_date">Bill date</th>
                  <th data-sort="category">Category</th>
                  <th data-sort="status">Status</th>
                  <th class="cell-money" data-sort="total">Amount</th>
                  <th class="col-actions"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody id="financeBillsTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeBillsEmpty" style="display: none;">
              <i class="fa-solid fa-receipt"></i>
              <p>No vendor bills recorded yet.</p>
            </div>
            <div id="financeBillsPagination" class="pagination-bar" style="display: none;"></div>
          </div>

          <!-- 2. Vendors Sub-View -->
          <div class="card clean-table-card" id="financeVendorsContainer" style="display: none;">
            <div class="section-loading-bar" id="financeVendorsLoadingBar"><span></span></div>
            <div id="financeVendorFilterChips" style="display: none;"></div>
            <table class="responsive-card-table" id="financeVendorsTable">
              <thead>
                <tr>
                  <th data-sort="name">Vendor / Supplier Name</th>
                  <th data-sort="category">Category</th>
                  <th data-sort="email">Billing Email</th>
                  <th data-sort="phone">Phone</th>
                  <th data-sort="tax_id">Tax ID</th>
                  <th data-sort="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeVendorsTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeVendorsEmpty" style="display: none;">
              <i class="fa-solid fa-truck-field"></i>
              <p>No vendors registered yet. Click "Add Vendor" to register suppliers.</p>
            </div>
            <div id="financeVendorsPagination" class="pagination-bar" style="display: none;"></div>
          </div>
        </section>
