        <section class="page-section" id="a-finance-bills">
          <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <div class="filter-tabs" id="financeBillSubNav" role="tablist" aria-label="Vendor bills sub navigation">
                <button class="filter-tab active" id="tabFinanceBills" role="tab" aria-selected="true" tabindex="0" onclick="switchBillSubTab('bills')"><i class="fa-solid fa-receipt"></i> Vendor Bills</button>
                <button class="filter-tab" id="tabFinanceVendors" role="tab" aria-selected="false" tabindex="-1" onclick="switchBillSubTab('vendors')"><i class="fa-solid fa-truck-field"></i> Vendors</button>
              </div>
              <div class="search-box" id="financeBillSearchBox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeBillSearch" placeholder="Search bills..." aria-label="Search bills" oninput="filterFinanceBills(this.value)">
              </div>
              <button type="button" class="btn btn-outline" id="financeBillFilterToggleBtn" aria-expanded="false" aria-controls="financeBillFilterPanel" onclick="toggleBillFilterPanel()" style="display: inline-flex; align-items: center; gap: 6px; height: 38px;">
                <i class="fa-solid fa-filter"></i> <span id="financeBillFilterToggleText">Filters</span>
                <span id="financeBillFilterBadge" class="badge badge-primary" style="display: none; font-size: 11px; padding: 2px 6px;">0</span>
              </button>
              <div class="search-box" id="financeVendorSearchBox" style="display: none;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeVendorSearch" placeholder="Search vendors..." aria-label="Search vendors" oninput="filterFinanceVendors(this.value)">
              </div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-outline" id="financeAddVendorBtn" onclick="openAddVendorModal()"><i class="fa-solid fa-plus"></i> Add Vendor</button>
              <button class="btn btn-outline" id="financeCaptureBillBtn" onclick="openCaptureBillModal()"><i class="fa-solid fa-file-arrow-up"></i> Upload / Capture</button>
              <button class="btn btn-fill" id="financeRecordBillBtn" onclick="openAddBillModal()"><i class="fa-solid fa-plus"></i> Record Bill</button>
            </div>
          </div>

          <!-- FUX-414: Status Toggle Bar (always visible, single row, ~40px tall) -->
          <div id="financeBillStatusToggleBar" class="finance-bill-status-toggle-bar" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; margin: 6px 0 8px 0; padding: 2px 0;">
            <!-- Left side: active status pill + result count -->
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
              <span id="financeBillActiveStatusPill" class="badge badge-primary" style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px; cursor: default; user-select: none;">
                <span id="financeBillActiveStatusLabel">All</span>
                <span id="financeBillActiveStatusCount" class="badge badge-grey" style="font-size: 11px; padding: 1px 6px; border-radius: 9999px; margin: 0;">0</span>
              </span>
              <span id="financeBillViewResultCount" style="font-size: 12px; color: var(--text3, #64748b);">Showing 0 of 0 bills</span>
            </div>

            <!-- Right side: Change view button with chevron -->
            <div>
              <button type="button" class="btn btn-outline btn-sm" id="financeBillChangeViewBtn" aria-expanded="false" aria-controls="financeBillStatusPanel" onclick="toggleBillStatusPanel()" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; font-size: 12px;">
                <span>Change view</span>
                <i class="fa-solid fa-chevron-down" id="financeBillChangeViewIcon" style="font-size: 10px; transition: transform 0.2s ease;"></i>
              </button>
            </div>
          </div>

          <!-- FUX-414: Status Tabs Panel (hidden by default, toggled by Change view) -->
          <div id="financeBillStatusPanel" class="finance-bill-status-panel" style="display: none; background: var(--surface2, #f8fafc); border: 1px solid var(--border, #e2e8f0); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;" role="region" aria-label="Status queue tabs">
            <div class="filter-tabs" id="financeBillWorkQueueTabs" role="tablist" aria-label="AP Inbox Queues" style="margin: 0; overflow-x: auto; white-space: nowrap;">
              <button type="button" class="filter-tab active" id="tabBillQueueAll" role="tab" aria-selected="true" onclick="setBillWorkQueue('all')">
                <i class="fa-solid fa-list-ul"></i> All <span class="badge badge-grey" id="badgeBillQueueAll">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueInbox" role="tab" aria-selected="false" onclick="setBillWorkQueue('inbox')">
                <i class="fa-solid fa-inbox"></i> Inbox <span class="badge badge-grey" id="badgeBillQueueInbox">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueCoding" role="tab" aria-selected="false" onclick="setBillWorkQueue('needs_coding')">
                <i class="fa-solid fa-tags"></i> Needs Coding <span class="badge badge-grey" id="badgeBillQueueCoding">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueApproval" role="tab" aria-selected="false" onclick="setBillWorkQueue('needs_approval')">
                <i class="fa-solid fa-user-check"></i> Needs Approval <span class="badge badge-grey" id="badgeBillQueueApproval">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueReady" role="tab" aria-selected="false" onclick="setBillWorkQueue('ready_to_pay')">
                <i class="fa-solid fa-money-check-dollar"></i> Ready to Pay <span class="badge badge-grey" id="badgeBillQueueReady">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueScheduled" role="tab" aria-selected="false" onclick="setBillWorkQueue('scheduled')">
                <i class="fa-solid fa-calendar-check"></i> Scheduled <span class="badge badge-grey" id="badgeBillQueueScheduled">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueuePaid" role="tab" aria-selected="false" onclick="setBillWorkQueue('paid')">
                <i class="fa-solid fa-circle-check"></i> Paid <span class="badge badge-grey" id="badgeBillQueuePaid">0</span>
              </button>
              <button type="button" class="filter-tab" id="tabBillQueueExceptions" role="tab" aria-selected="false" onclick="setBillWorkQueue('exceptions')">
                <i class="fa-solid fa-triangle-exclamation"></i> Exceptions <span class="badge badge-grey" id="badgeBillQueueExceptions">0</span>
              </button>
            </div>
          </div>

          <!-- Collapsible Filter Panel -->
          <div id="financeBillFilterPanel" class="finance-bill-filter-panel" style="display: none; background: var(--surface2, #f8fafc); border: 1px solid var(--border, #e2e8f0); border-radius: 8px; padding: 12px 16px; margin: 10px 0 12px 0;" role="region" aria-label="Secondary bill filters">
            <div style="display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;">
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="financeBillStatusFilter" style="font-size: 11.5px; font-weight: 600; color: var(--text2);">Status</label>
                <select id="financeBillStatusFilter" class="form-control filter-select" aria-label="Filter bills by status" onchange="onBillFilterChanged()">
                  <option value="">All Statuses</option>
                  <option value="unpaid">Unpaid</option>
                  <option value="paid">Paid</option>
                  <option value="overdue">Overdue</option>
                  <option value="void">Void</option>
                </select>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="financeBillAttachmentFilter" style="font-size: 11.5px; font-weight: 600; color: var(--text2);">Attachment</label>
                <select id="financeBillAttachmentFilter" class="form-control filter-select" aria-label="Filter bills by attachment" onchange="onBillFilterChanged()">
                  <option value="">All Documents</option>
                  <option value="with_attachment">Has Attachment</option>
                  <option value="no_attachment">No Attachment</option>
                </select>
              </div>
              <div>
                <button type="button" class="btn btn-outline btn-sm" id="financeBillResetFiltersBtn" onclick="resetBillSecondaryFilters()" style="height: 38px; display: inline-flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
              </div>
            </div>
            <div id="financeBillFilterChips" style="display: none; margin-top: 10px;"></div>
          </div>

          <!-- 1. Bills Sub-View -->
          <div class="card" id="financeBillsContainer">
            <div class="section-loading-bar" id="financeBillsLoadingBar"><span></span></div>
            <table class="responsive-card-table" id="financeBillsTable">
              <thead>
                <tr>
                  <th data-sort="bill_number">Bill #</th>
                  <th data-sort="vendor_name">Vendor</th>
                  <th data-sort="category">Category & Dept</th>
                  <th data-sort="issue_date">Issue Date</th>
                  <th data-sort="due_date">Due Date</th>
                  <th class="cell-money" data-sort="total">Total</th>
                  <th data-sort="status">Queue / Status</th>
                  <th>Capture & Review</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeBillsTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeBillsEmpty" style="display: none;">
              <i class="fa-solid fa-receipt"></i>
              <p>No vendor bills recorded yet.</p>
            </div>
            <div id="financeBillsPagination" class="pagination-bar" style="display: none;"></div>
          </div>

          <!-- 2. Vendors Sub-View -->
          <div class="card" id="financeVendorsContainer" style="display: none;">
            <div class="section-loading-bar" id="financeVendorsLoadingBar"><span></span></div>
            <div id="financeVendorFilterChips" style="display: none;"></div>
            <table class="responsive-card-table" id="financeVendorsTable">
              <thead>
                <tr>
                  <th data-sort="name">Vendor / Supplier Name</th>
                  <th data-sort="category">Category</th>
                  <th data-sort="email">Billing Email</th>
                  <th data-sort="phone">Phone</th>
                  <th data-sort="tax_id">Tax ID</th>
                  <th data-sort="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeVendorsTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeVendorsEmpty" style="display: none;">
              <i class="fa-solid fa-truck-field"></i>
              <p>No vendors registered yet. Click "Add Vendor" to register suppliers.</p>
            </div>
            <div id="financeVendorsPagination" class="pagination-bar" style="display: none;"></div>
          </div>
        </section>
