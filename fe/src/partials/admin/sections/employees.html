        <section class="page-section fv" id="a-employees">
          <div class="hv-toolbar">
            <div role="group" aria-label="Filter by status" class="filter-tab-group fv-pills" id="employeeStatusFilterGroup">
              <button type="button" class="filter-tab fv-pill active" data-emp-status="all" onclick="filterEmployeesByStatus('all')">All <span class="hv-count-fade" id="empCountAll"></span></button>
              <button type="button" class="filter-tab fv-pill" data-emp-status="Active" onclick="filterEmployeesByStatus('Active')"><span class="hv-dot hv-dot--success"></span>Active <span class="hv-count-fade hv-count-fade--sm" id="empCountActive"></span></button>
              <button type="button" class="filter-tab fv-pill" data-emp-status="On leave" onclick="filterEmployeesByStatus('On leave')"><span class="hv-dot hv-dot--info"></span>On leave <span class="hv-count-fade hv-count-fade--sm" id="empCountOnLeave"></span></button>
              <button type="button" class="filter-tab fv-pill" data-emp-status="Archived" onclick="filterEmployeesByStatus('Archived')"><span class="hv-dot hv-dot--muted"></span>Archived <span class="hv-count-fade hv-count-fade--sm" id="empCountArchived"></span></button>
            </div>
            <div class="hv-row-8">
              <div class="search-box hv-w-230">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="empSearch" placeholder="Search employees">
              </div>
              <button class="btn btn-outline" id="employeesExportBtn" onclick="openExportModal('employees')" title="Export employee records">Export</button>
              <button class="btn btn-fill" id="btnAddEmployee" onclick="openEmployeeModal()">Add employee</button>
            </div>
          </div>
          <div class="card fv-table-card">
            <div class="section-loading-bar" id="empTableLoadingBar"><span></span></div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table">
                <thead>
                  <tr>
                    <th data-sort-default="asc" style="width: 28%; min-width: 220px;">Employee</th>
                    <th style="width: 22%; min-width: 180px;">Role</th>
                    <th style="width: 14%; min-width: 110px;">Employment</th>
                    <th style="display:none;">Salary</th>
                    <th style="width: 14%; min-width: 120px;">Next raise</th>
                    <th style="width: 10%; min-width: 90px;">Status</th>
                    <th class="hv-right" style="width: 12%; min-width: 130px;"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="employeesTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
