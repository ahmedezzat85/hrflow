        <section class="page-section fv" id="a-insurance">
          <div class="hv-grid hv-grid-4">
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Total claims</span>
              <span class="hv-stat-value" id="statClaimsYtd">—</span>
              <span class="hv-stat-sub">Year to date</span>
            </div>
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Approved</span>
              <span class="hv-stat-value hv-tone-success" id="statClaimsApproved">—</span>
              <span class="hv-stat-sub">Processed claims</span>
            </div>
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Waiting for a decision</span>
              <span class="hv-stat-value hv-tone-warning" id="statClaimsPending">—</span>
              <span class="hv-stat-sub">Pending review</span>
            </div>
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Reimbursed</span>
              <span class="hv-stat-value" id="statClaimsReimbursed">—</span>
              <span class="hv-stat-sub">This year</span>
            </div>
          </div>
          <div class="hv-grid hv-grid-2">
            <div class="card hv-pad">
              <div class="card-head hv-mb-12">
                <h3 class="hv-card-title">Use against annual limits</h3>
              </div>
              <div class="grid g4" id="adminInsuranceCategoryHighlights"></div>
            </div>
            <div class="card fv-table-card">
              <div class="card-head hv-card-head">
                <h3 class="hv-card-title">Categories and limits</h3>
                <button class="btn btn-fill btn-sm" onclick="openCategoryModal()"><i class="fa-solid fa-plus"></i> Add category</button>
              </div>
              <div class="fv-table-scroll">
                <table class="fv-table">
                  <thead>
                    <tr>
                      <th>Category</th>
                      <th>Annual limit</th>
                      <th class="col-actions">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="categoriesTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="card fv-table-card">
            <div class="card-head hv-card-head">
              <div>
                <h3 class="hv-card-title">Claims</h3>
              </div>
              <div class="hv-row-8">
                <button class="btn btn-outline btn-sm" id="insuranceExportBtn" onclick="openExportModal('insurance')" title="Export insurance claims"><i class="fa-solid fa-file-export"></i> Export</button>
                <button type="button" class="btn btn-fill btn-sm" onclick="openBehalfClaimModal()"><i class="fa-solid fa-plus"></i> Record claim</button>
              </div>
            </div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Category</th>
                    <th>Provider</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th class="col-actions">Actions</th>
                  </tr>
                </thead>
                <tbody id="insuranceTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
