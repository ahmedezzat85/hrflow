        <section class="page-section fv" id="a-invoices">
          <!-- Invoices Toolbar -->
          <div class="hv-toolbar">
            <span class="hv-row-10">
              <button type="button" class="hv-select hv-row-8" id="invPeriodBtn" onclick="openInvoicePeriodModal()">
                <span id="invPeriodBtnLabel">—</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <input type="hidden" id="invPaymentYear">
              <input type="hidden" id="invPaymentMonth">
              <span class="hv-stat-sub">Salary payment doc per employee paid an external USD salary, from the approved rates</span>
            </span>
            <span class="hv-row-8">
              <button type="button" class="btn btn-outline btn-sm" id="btnPreviewInvoices" onclick="previewInvoiceEligibility(event)">Preview employees</button>
              <button type="button" class="btn btn-fill btn-sm" id="btnGenerateBulkInvoices" onclick="generateBulkInvoices(event)">Generate docs</button>
            </span>
          </div>

          <!-- Eligibility preview card -->
          <div class="card fv-table-card hv-mb-14">
            <div class="card-head hv-card-head hv-wrap">
              <h3 class="hv-card-title" id="invoiceResultsTitle">Who gets a doc</h3>
              <div role="group" aria-label="Filter" class="invoice-filter-group" id="invoiceStatusFilterGroup">
                <button type="button" class="filter-tab fv-pill active" id="invFilterAllBtn" aria-pressed="true" onclick="setInvoiceEligibilityFilter('all')">All <span class="hv-count" id="invCountAll">0</span></button>
                <button type="button" class="filter-tab fv-pill" id="invFilterEligibleBtn" aria-pressed="false" onclick="setInvoiceEligibilityFilter('eligible')">Ready <span class="hv-count" id="invCountReady">0</span></button>
                <button type="button" class="filter-tab fv-pill" id="invFilterGeneratedBtn" aria-pressed="false" onclick="setInvoiceEligibilityFilter('generated')">Generated <span class="hv-count" id="invCountGenerated">0</span></button>
                <button type="button" class="filter-tab fv-pill" id="invFilterSkippedBtn" aria-pressed="false" onclick="setInvoiceEligibilityFilter('skipped')">Skipped <span class="hv-count" id="invCountSkipped">0</span></button>
              </div>
            </div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table" id="invoiceResultsTable">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Payment doc ID</th>
                    <th class="hv-right">External USD</th>
                    <th>Status</th>
                    <th class="hv-right"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="invoiceResultsBody"></tbody>
              </table>
            </div>
          </div>

          <!-- Generated docs history card -->
          <div class="card fv-table-card" id="invoiceHistoryCard">
            <div class="card-head hv-card-head hv-wrap">
              <div class="hv-row-10">
                <h3 class="hv-card-title">Generated docs</h3>
                <span id="invoiceHistoryTotalBadge" class="badge-pill pill-info" style="display:none;">0 docs</span>
              </div>
              <div class="hv-row-8">
                <div class="hv-row-8" id="invoiceSortBar">
                  <button type="button" class="btn btn-outline btn-xs active" id="sortByNameBtn" onclick="toggleInvoiceSort('name')">Name</button>
                  <button type="button" class="btn btn-outline btn-xs" id="sortByNumberBtn" onclick="toggleInvoiceSort('number')">Doc #</button>
                </div>
                <button type="button" class="btn btn-outline btn-xs" id="toggleAllMonthsBtn" onclick="toggleAllInvoiceMonths()">
                  <span id="toggleAllMonthsText">Collapse all</span>
                </button>
              </div>
            </div>
            <div id="invoiceHistoryContainer" class="invoice-history-container">
              <div class="hv-empty"><p class="hv-stat-sub">Loading salary payment doc history...</p></div>
            </div>
          </div>
        </section>
