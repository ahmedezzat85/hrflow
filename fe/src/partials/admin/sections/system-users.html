        <section class="page-section fv" id="a-system-users">
          <h2 class="section-title sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); font-size: 18px;">User accounts and access</h2>
          <div class="toolbar sys-toolbar" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap;">
            <div class="filter-group">
              <select id="systemUsersFilter" class="filter-select hv-select" aria-label="Show users" style="height: 32px; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 8px; background: var(--fv-surface); font-size: 13px; color: var(--ink-strong);">
                <option value="all">All</option>
                <option value="employees">Employees</option>
                <option value="external">External</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
              <select id="systemUsersRoleFilter" aria-label="Filter by role" class="filter-select hv-select" style="height: 32px; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 8px; background: var(--fv-surface); font-size: 13px; color: var(--ink-strong);">
                <option value="all">All roles</option>
              </select>
              <div class="search-box" style="display: flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--fv-input-border); border-radius: 8px; background: var(--fv-surface); color: var(--ink-muted); font-size: 13px; width: 200px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="systemUsersSearch" aria-label="Search users" placeholder="Search users" style="border: 0; background: transparent; outline: none; font-size: 13px; color: var(--ink-strong); width: 100%; padding: 0;">
              </div>
              <button class="btn btn-fill" id="btnAddExternalUser" onclick="openExternalUserModal()" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 13px;">Add external user</button>
            </div>
          </div>
          <div class="card fv-table-card" style="background: var(--fv-surface); border: 1px solid var(--fv-line); border-radius: 14px; box-shadow: var(--fv-shadow-card); overflow: hidden;">
            <div class="section-loading-bar" id="usersTableLoadingBar"><span></span></div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                  <tr>
                    <th scope="col" style="width: 26%; min-width: 200px; text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: var(--brand); border-bottom: 1px solid var(--fv-line-strong);">User ↑</th>
                    <th scope="col" style="width: 28%; min-width: 220px; text-align: left; padding: 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line-strong);">Email</th>
                    <th scope="col" style="width: 18%; min-width: 150px; text-align: left; padding: 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line-strong);">Role</th>
                    <th scope="col" style="width: 14%; min-width: 100px; text-align: left; padding: 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line-strong);">Status</th>
                    <th scope="col" class="col-actions" style="width: 14%; min-width: 130px; padding: 12px 16px; border-bottom: 1px solid var(--fv-line-strong); text-align: right;"><span class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0);">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="systemUsersTableBody"></tbody>
              </table>
              <div id="systemUsersFooter" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 12.5px; color: var(--ink-muted); border-top: 1px solid var(--fv-line); background: var(--fv-surface);">
                <span id="systemUsersCountText">Showing <strong style="color: var(--brand);">1–6</strong> of <strong style="color: var(--brand);">6</strong> users · you cannot archive your own account</span>
                <span>Page 1 of 1</span>
              </div>
            </div>
          </div>
        </section>
