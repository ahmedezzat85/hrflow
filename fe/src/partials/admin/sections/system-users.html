        <section class="page-section fv" id="a-system-users">
          <div class="toolbar hv-mb-14">
            <div class="section-title-group">
              <h2 class="section-title"><i class="fa-solid fa-users-gear"></i> User accounts and access</h2>
              <p class="section-subtitle">Manage user identity, the assigned role, and account access status.</p>
            </div>
            <div class="hv-row-10 hv-wrap">
              <button class="btn btn-fill" id="btnAddExternalUser" onclick="openExternalUserModal()"><i class="fa-solid fa-user-plus"></i> Add external user</button>
              <div class="filter-group">
                <select id="systemUsersFilter" class="filter-select hv-select" aria-label="Show users">
                  <option value="all">All</option>
                  <option value="employees">Employees</option>
                  <option value="external">External</option>
                  <option value="archived">Archived</option>
                </select>
              </div>
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="systemUsersSearch" aria-label="Search users" placeholder="Search by name, email, or role...">
              </div>
              <div class="filter-group">
                <select id="systemUsersRoleFilter" aria-label="Filter by role" class="filter-select hv-select">
                  <option value="all">All roles</option>
                </select>
              </div>
            </div>
          </div>
          <div class="card fv-table-card">
            <div class="section-loading-bar" id="usersTableLoadingBar"><span></span></div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="col-actions">Actions</th>
                  </tr>
                </thead>
                <tbody id="systemUsersTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
