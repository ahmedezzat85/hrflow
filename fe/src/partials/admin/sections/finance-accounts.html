        <section class="page-section" id="a-finance-accounts">
          <div class="toolbar">
            <div class="section-title-group">
              <h2 class="section-title"><i class="fa-solid fa-building-columns"></i> Company Bank Accounts</h2>
              <p class="section-subtitle">Accounts used for receiving customer payments and disbursing payroll & bills.</p>
            </div>
            <button class="btn btn-fill" onclick="showToast('Bank Account management will be available in Phase 4', 'info')"><i class="fa-solid fa-plus"></i> Add Account</button>
