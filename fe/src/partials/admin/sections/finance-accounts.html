        <section class="page-section" id="a-finance-accounts">
          <div class="toolbar">
            <div class="section-title-group">
              <h2 class="section-title"><i class="fa-solid fa-building-columns"></i> Company Bank Accounts</h2>
              <p class="section-subtitle">Accounts used for receiving customer payments and disbursing payroll & bills.</p>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterCompanyBankAccounts('all', this)">All</button>
                <button class="filter-tab" data-filter="active" onclick="filterCompanyBankAccounts('active', this)">Active</button>
                <button class="filter-tab" data-filter="inactive" onclick="filterCompanyBankAccounts('inactive', this)">Inactive</button>
              </div>
              <button class="btn btn-fill" onclick="openAddCompanyBankAccountModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
            </div>
          </div>
          <div class="card">
            <div class="section-loading-bar" id="financeAccountsLoadingBar"><span></span></div>
            <table class="responsive-card-table">
              <thead>
                <tr>
                  <th>Account Name</th>
                  <th>Bank Name</th>
                  <th>Account Number</th>
                  <th>Currency</th>
                  <th>Current Balance</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeAccountsTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeAccountsEmpty" style="display: none;">
              <i class="fa-solid fa-building-columns"></i>
              <p>No company bank accounts configured yet.</p>
            </div>
          </div>
        </section>
