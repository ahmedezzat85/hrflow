        <section class="page-section fv" id="a-holidays">

            <div class="card-head hv-card-head hv-wrap">
              <div>
                <h3 class="hv-card-title">Official holidays</h3>
                <div class="hv-stat-sub">Leave requests exclude these days, together with Friday and Saturday</div>
              </div>
              <div class="hv-row-8">
                <select aria-label="Year" id="adminHolidayYear" class="hv-select" onchange="onHolidayYearChange(this.value)"></select>

              </div>
            </div>
            <div class="fv-table-scroll">

                  </tr>
                </thead>

              </table>
            </div>
          </div>
        </section>
