        <section class="page-section fv" id="a-vacations">
          <div class="hv-grid hv-grid-3">
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Days allotted in 2026</span>
              <span class="hv-stat-value" id="statVacAllotted">0</span>
              <span class="hv-stat-sub" id="statVacAllottedSub">Across all employees</span>
            </div>
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Days used so far</span>
              <span class="hv-stat-value"><span id="statVacUsed">0</span> <span id="statVacUsedPct" class="hv-stat-sub" style="font-size:14px;font-weight:500;">· 0%</span></span>
              <span class="progress-bar" style="height:6px;border-radius:999px;background:var(--surface2);display:block;margin-top:4px;"><span id="statVacUsedBar" style="display:block;height:6px;border-radius:999px;background:var(--id-teal);width:0%;"></span></span>
            </div>
            <div class="hv-stat-tile hv-clickable" onclick="showSection('a-requests','admin')">
              <span class="hv-stat-label">On leave today</span>
              <span class="hv-stat-value" id="statEmployeesOnLeave">0</span>
              <span class="hv-between-meta"><span id="statEmployeesOnLeaveSub">Real-time status</span><span class="hv-text-brand hv-bold">Requests ›</span></span>
            </div>
          </div>
          <div class="card fv-table-card">
            <div class="card-head hv-card-head hv-wrap">
              <div>
                <h3 class="hv-card-title">Balances</h3>
                <div class="hv-stat-sub">Annual leave per employee for 2026</div>
              </div>
              <div class="hv-row-8">
                <select aria-label="Department" id="vacDeptFilter" class="hv-select" onchange="filterVacationBalances()">
                  <option value="">All departments</option>
                </select>
                <div class="search-box hv-w-190">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                  <input id="vacBalanceSearch" placeholder="Search employees" oninput="filterVacationBalances()">
                </div>
                <button type="button" class="btn btn-fill btn-sm" id="btnRecordLeave" onclick="openBehalfVacationModal()">Record leave</button>
              </div>
            </div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th class="hv-right">Entitled</th>
                    <th class="hv-right">Used</th>
                    <th class="hv-right" data-sort-default="asc">Remaining</th>
                    <th style="width:240px;">Usage</th>
                    <th class="hv-right"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="vacationBalanceBody"></tbody>
              </table>
            </div>
          </div>
        </section>
