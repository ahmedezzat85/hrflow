        <section class="page-section fv" id="a-vacations">
          <div class="hv-grid hv-grid-3">
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Days allotted</span>
              <span class="hv-stat-value" id="statVacAllotted">0</span>
              <span class="hv-stat-sub">Across all employees</span>
            </div>
            <div class="hv-stat-tile">
              <span class="hv-stat-label">Days used so far</span>
              <span class="hv-stat-value" id="statVacUsed">0</span>
              <span class="hv-stat-sub" id="statVacUsedPct"><i class="fa-solid fa-chart-pie"></i> 0% consumed</span>
            </div>
            <div class="hv-stat-tile hv-clickable" onclick="showSection('a-requests','admin')">
              <span class="hv-stat-label">On leave today</span>
              <span class="hv-stat-value" id="statEmployeesOnLeave">0</span>
              <span class="hv-between-meta"><span>Real-time status</span><span class="hv-text-brand hv-bold">Requests ›</span></span>
            </div>
          </div>
          <div class="card fv-table-card">
            <div class="card-head hv-card-head hv-wrap">
              <div>
                <h3 class="hv-card-title">Balances</h3>
                <div class="hv-stat-sub">Annual leave per employee</div>
              </div>
              <div class="hv-row-8">
                <div class="search-box hv-w-220">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input id="vacBalanceSearch" placeholder="Search employees..." oninput="filterVacationBalances()">
                </div>
                <button type="button" class="btn btn-fill" onclick="openBehalfVacationModal()"><i class="fa-solid fa-plus"></i> Record leave</button>
              </div>
            </div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table">
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Entitled</th>
                    <th>Used</th>
                    <th>Remaining</th>
                    <th class="hv-minw-180">Utilization progress</th>
                  </tr>
                </thead>
                <tbody id="vacationBalanceBody"></tbody>
              </table>
            </div>
          </div>
        </section>
