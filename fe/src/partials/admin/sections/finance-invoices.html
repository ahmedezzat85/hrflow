        <section class="page-section fv" id="a-finance-invoices">
          <div class="fv-head">
            <div class="filter-tabs fv-subnav" id="financeInvoiceSubNav" role="tablist" aria-label="Sales invoices sub navigation">
              <button class="filter-tab active" id="tabFinanceInvoices" role="tab" aria-selected="true" tabindex="0" onclick="switchInvoiceSubTab('invoices')">Invoices</button>
              <button class="filter-tab" id="tabFinanceCustomers" role="tab" aria-selected="false" tabindex="-1" onclick="switchInvoiceSubTab('customers')">Customers</button>
            </div>
            <div class="fv-head-actions">
              <div class="fv-search" id="financeInvoiceSearchBox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeInvoiceSearch" placeholder="Search invoices..." aria-label="Search invoices" oninput="filterFinanceInvoices(this.value)">
              </div>
              <div class="fv-search" id="financeCustomerSearchBox" style="display: none;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeCustomerSearch" placeholder="Search customers..." aria-label="Search customers" oninput="filterFinanceCustomers(this.value)">
              </div>
              <button class="btn btn-fill" id="financeAddCustomerBtn" onclick="openAddCustomerModal()" style="display:none;">Add Customer</button>
              <button class="btn btn-fill" id="financeNewInvoiceBtn" onclick="openAddInvoiceModal()">New Sales Invoice</button>
            </div>
          </div>

          <!-- 1. Invoices Sub-View -->
          <div id="financeInvoicesContainer">
            <div class="fv-pills-row">
              <div class="fv-pills" id="financeInvoiceWorkQueueTabs" role="tablist" aria-label="Invoice status">
                <button type="button" class="filter-tab fv-pill active" id="tabQueueAll" data-queue="all" role="tab" aria-selected="true" onclick="setInvoiceWorkQueue('all')">All <span class="fv-pill__count" id="badgeQueueAll">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--draft" id="tabQueueDraft" data-queue="draft" role="tab" aria-selected="false" onclick="setInvoiceWorkQueue('draft')"><span class="fv-pill__dot" aria-hidden="true"></span>Draft <span class="fv-pill__count" id="badgeQueueDraft">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--open" id="tabQueueSent" data-queue="sent" role="tab" aria-selected="false" onclick="setInvoiceWorkQueue('sent')"><span class="fv-pill__dot" aria-hidden="true"></span>Sent <span class="fv-pill__count" id="badgeQueueSent">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--part" id="tabQueuePartiallyPaid" data-queue="partially_paid" role="tab" aria-selected="false" onclick="setInvoiceWorkQueue('partially_paid')"><span class="fv-pill__dot" aria-hidden="true"></span>Partially paid <span class="fv-pill__count" id="badgeQueuePartiallyPaid">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--settled" id="tabQueuePaid" data-queue="paid" role="tab" aria-selected="false" onclick="setInvoiceWorkQueue('paid')"><span class="fv-pill__dot" aria-hidden="true"></span>Paid <span class="fv-pill__count" id="badgeQueuePaid">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--closed" id="tabQueueVoid" data-queue="void" role="tab" aria-selected="false" onclick="setInvoiceWorkQueue('void')"><span class="fv-pill__dot" aria-hidden="true"></span>Void <span class="fv-pill__count" id="badgeQueueVoid">0</span></button>
              </div>
              <label for="financeInvoiceOverdueOnly" class="fv-toggle">
                <input type="checkbox" id="financeInvoiceOverdueOnly" onchange="onInvoiceOverdueOnlyChange(this.checked)"> Overdue only <span class="fv-toggle__count" id="financeInvoiceOverdueCount">0</span>
              </label>
            </div>

            <div class="fv-table-card">
              <div class="section-loading-bar" id="financeInvoicesLoadingBar"><span></span></div>
              <div class="fv-table-scroll">
                <table class="fv-table fv-table--invoices responsive-card-table sticky-actions" id="financeInvoicesTable">
                  <thead>
                    <tr>
                      <th data-sort="customer_name">Invoice</th>
                      <th data-sort="issue_date">Issued</th>
                      <th data-sort="due_date">Due</th>
                      <th>Route</th>
                      <th data-sort="status">Status</th>
                      <th class="cell-money fv-num" data-sort="balance">Balance</th>
                      <th class="col-actions"><span class="fv-sr-only">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="financeInvoicesTableBody"></tbody>
                </table>
              </div>
              <div class="empty-state fv-empty" id="financeInvoicesEmpty" style="display: none;">
                <p>No sales invoices recorded yet.</p>
              </div>
              <div id="financeInvoicesPagination" class="pagination-bar" style="display: none;"></div>
            </div>
          </div>

          <!-- 2. Customers Sub-View -->
          <div id="financeCustomersContainer" style="display: none;">
            <div class="fv-pills-row">
              <div class="fv-pills" id="financeCustomerStatusPills" role="group" aria-label="Customer status">
                <button type="button" class="filter-tab fv-pill active" data-filter="all" aria-pressed="true" onclick="setCustomerStatusFilter('all')">All <span class="fv-pill__count" id="custPillCountAll">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--settled" data-filter="active" aria-pressed="false" onclick="setCustomerStatusFilter('active')"><span class="fv-pill__dot" aria-hidden="true"></span>Active <span class="fv-pill__count" id="custPillCountActive">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--closed" data-filter="inactive" aria-pressed="false" onclick="setCustomerStatusFilter('inactive')"><span class="fv-pill__dot" aria-hidden="true"></span>Inactive <span class="fv-pill__count" id="custPillCountInactive">0</span></button>
                <button type="button" class="filter-tab fv-pill fv-pill--problem" id="custPillLate" data-filter="late" aria-pressed="false" onclick="setCustomerStatusFilter('late')" style="display:none;"><span class="fv-pill__dot" aria-hidden="true"></span>With late invoices <span class="fv-pill__count" id="custPillCountLate">0</span></button>
              </div>
            </div>

            <div class="fv-table-card">
              <div class="section-loading-bar" id="financeCustomersLoadingBar"><span></span></div>
              <div id="financeCustomerFilterChips" style="display: none;"></div>
              <div class="fv-table-scroll">
                <table class="fv-table fv-table--customers responsive-card-table" id="financeCustomersTable">
                  <thead>
                    <tr>
                      <th data-sort="name">Customer</th>
                      <th>Contact</th>
                      <th>Terms</th>
                      <th>Status</th>
                      <th class="fv-num">Open balance</th>
                      <th class="col-actions"><span class="fv-sr-only">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="financeCustomersTableBody"></tbody>
                </table>
              </div>
              <div class="empty-state fv-empty" id="financeCustomersEmpty" style="display: none;">
                <p>No customers recorded yet. Click "Add Customer" to create one.</p>
              </div>
              <div class="fv-foot" id="financeCustomersFooter"></div>
            </div>
          </div>
        </section>
