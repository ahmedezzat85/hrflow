        <section class="page-section" id="a-finance-invoices">
          <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <div class="filter-tabs" id="financeInvoiceSubNav" role="tablist" aria-label="Sales invoices sub navigation">
                <button class="filter-tab active" id="tabFinanceInvoices" role="tab" aria-selected="true" tabindex="0" onclick="switchInvoiceSubTab('invoices')"><i class="fa-solid fa-file-invoice"></i> Sales Invoices</button>
                <button class="filter-tab" id="tabFinanceCustomers" role="tab" aria-selected="false" tabindex="-1" onclick="switchInvoiceSubTab('customers')"><i class="fa-solid fa-users"></i> Customers</button>
              </div>
              <div class="search-box" id="financeInvoiceSearchBox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeInvoiceSearch" placeholder="Search invoices..." aria-label="Search invoices" oninput="filterFinanceInvoices(this.value)">
              </div>
              <div class="search-box" id="financeCustomerSearchBox" style="display: none;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="financeCustomerSearch" placeholder="Search customers..." aria-label="Search customers" oninput="filterFinanceCustomers(this.value)">
              </div>
              <!-- Status filter (invoices only) -->
              <select id="financeInvoiceStatusFilter" class="form-control filter-select" aria-label="Filter invoices by status" onchange="loadFinanceInvoices()">
                <option value="">All Statuses</option>
                <option value="draft">Draft</option>
                <option value="sent">Sent</option>
                <option value="paid">Paid</option>
                <option value="overdue">Overdue</option>
                <option value="void">Void</option>
              </select>
              <div id="financeInvoiceDensityControl"></div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-outline" id="financeAddCustomerBtn" onclick="openAddCustomerModal()" style="display:none;"><i class="fa-solid fa-user-plus"></i> Add Customer</button>
              <button class="btn btn-fill" id="financeNewInvoiceBtn" onclick="openAddInvoiceModal()"><i class="fa-solid fa-plus"></i> New Sales Invoice</button>
            </div>
          </div>

          <!-- 1. Invoices Sub-View -->
          <div class="card" id="financeInvoicesContainer">
            <div class="section-loading-bar" id="financeInvoicesLoadingBar"><span></span></div>
            <div id="financeInvoiceFilterChips" style="display: none;"></div>
            <table class="responsive-card-table" id="financeInvoicesTable">
              <thead>
                <tr>
                  <th data-sort="invoice_number">Invoice #</th>
                  <th data-sort="customer_name">Customer</th>
                  <th>Route / Channel</th>
                  <th data-sort="issue_date">Issue Date</th>
                  <th data-sort="due_date">Due Date</th>
                  <th class="cell-money" data-sort="total">Total</th>
                  <th data-sort="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeInvoicesTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeInvoicesEmpty" style="display: none;">
              <i class="fa-solid fa-file-invoice"></i>
              <p>No sales invoices recorded yet.</p>
            </div>
            <div id="financeInvoicesPagination" class="pagination-bar" style="display: none;"></div>
          </div>

          <!-- 2. Customers Sub-View -->
          <div class="card" id="financeCustomersContainer" style="display: none;">
            <div class="section-loading-bar" id="financeCustomersLoadingBar"><span></span></div>
            <div id="financeCustomerFilterChips" style="display: none;"></div>
            <table class="responsive-card-table" id="financeCustomersTable">
              <thead>
                <tr>
                  <th data-sort="name">Customer / Company Name</th>
                  <th data-sort="email">Billing Email</th>
                  <th data-sort="phone">Phone</th>
                  <th data-sort="tax_id">Tax ID</th>
                  <th data-sort="status">Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="financeCustomersTableBody"></tbody>
            </table>
            <div class="empty-state" id="financeCustomersEmpty" style="display: none;">
              <i class="fa-solid fa-users"></i>
              <p>No customers recorded yet. Click "Add Customer" to create one.</p>
            </div>
            <div id="financeCustomersPagination" class="pagination-bar" style="display: none;"></div>
          </div>
        </section>
