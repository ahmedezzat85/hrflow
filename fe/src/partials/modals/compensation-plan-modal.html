  <div class="modal-overlay fv fv-dialog fv-dialog--w640 fv-area-green" id="compensationPlanModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 7v10M17 7v10"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="compPlanModalTitle">Pay plan</h3>
          <p>Effective-dated external USD and internal USD cash amounts</p>
        </div>
        <button class="modal-close" onclick="closeModal('compensationPlanModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <!-- Current active plan: one row per part (mock Dlg-CompPlan) -->
        <div class="form-section">
          <div class="fv-plan-summary">
            <span id="compPlanEmpName">—</span>
            <span class="badge-pill pill-primary" id="compPlanTotalBadge">$0.00 / month</span>
          </div>
          <div class="fv-plan-table">
            <table>
              <thead>
                <tr><th>Part</th><th class="fv-num">Amount</th><th>Basis</th><th>From</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>External USD</strong></td>
                  <td class="fv-num" id="compPlanActiveExternal">$0.00</td>
                  <td>Net</td>
                  <td id="compPlanExtEffective">—</td>
                </tr>
                <tr>
                  <td><strong>Internal USD cash</strong></td>
                  <td class="fv-num" id="compPlanActiveInternal">$0.00</td>
                  <td id="compPlanIntBasis">Net</td>
                  <td id="compPlanIntEffective">—</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add a change -->
        <div class="form-section">
          <div class="fv-dialog-section-title">Add a change</div>
          <div class="form-grid">
            <div class="form-field">
              <label for="compPlanComponentType">Part</label>
              <select id="compPlanComponentType" onchange="onCompPlanTypeChange()">
                <option value="external_usd">External USD, US transfer</option>
                <option value="internal_usd_cash">Internal USD cash, paid locally</option>
              </select>
            </div>
            <div class="form-field">
              <label for="compPlanAmount">New amount, USD</label>
              <input inputmode="decimal" type="number" id="compPlanAmount" step="0.01" min="0.01" placeholder="0.00" style="text-align: right;">
            </div>
            <div class="form-field" id="compPlanSalaryBasisContainer" style="display:none;">
              <label for="compPlanSalaryBasis">Salary basis</label>
              <select id="compPlanSalaryBasis">
                <option value="NET" selected>Net, target net pay protected</option>
                <option value="GROSS">Gross, local statutory deductions apply</option>
              </select>
            </div>
            <div class="form-field">
              <label for="compPlanStartDate">Effective from</label>
              <input type="date" id="compPlanStartDate">
            </div>
            <div class="form-field full">
              <label for="compPlanNotes">Notes, optional</label>
              <textarea id="compPlanNotes" rows="2" placeholder="Why this changes"></textarea>
            </div>
          </div>
        </div>

        <!-- Effective-dated history (real feature, kept after the mock sections) -->
        <div class="form-section">
          <div class="fv-dialog-section-title">History</div>
          <div style="max-height:220px; overflow-y:auto; border:1px solid var(--fv-line); border-radius:10px;">
            <table class="responsive-card-table" style="font-size:12.5px;">
              <thead>
                <tr>
                  <th>Component</th>
                  <th>Basis</th>
                  <th>Amount</th>
                  <th>Start date</th>
                  <th>End date</th>
                  <th>Status</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="compPlanHistoryBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="compPlanCloseBtn" onclick="closeModal('compensationPlanModal')">Close</button>
        <button class="btn btn-fill" id="compPlanSaveBtn" onclick="saveCompPlanComponent(event)">Add change</button>
      </div>
    </div>
  </div>
