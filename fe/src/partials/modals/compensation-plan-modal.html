  <div class="modal-overlay fv fv-dialog fv-dialog--w640 fv-area-green" id="compensationPlanModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 7v10M17 7v10"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="compPlanModalTitle">Pay plan</h3>
          <p>Set both parts in one change. Enter 0 to end a part.</p>
        </div>
        <button class="modal-close" onclick="closeModal('compensationPlanModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <!-- Current active plan: one row per part (mock Dlg-CompPlan) -->
        <div class="form-section">
          <div class="fv-plan-summary">
            <span id="compPlanEmpName">—</span>
            <span class="badge-pill pill-primary" id="compPlanTotalBadge">$0.00 / month</span>
          </div>
          <div class="fv-plan-table">
            <table>
              <thead>
                <tr><th>Part</th><th class="fv-num">Amount</th><th>Basis</th><th>From</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>External USD</strong></td>
                  <td class="fv-num" id="compPlanActiveExternal">$0.00</td>
                  <td>Net</td>
                  <td id="compPlanExtEffective">—</td>
                </tr>
                <tr>
                  <td><strong>Internal USD cash</strong></td>
                  <td class="fv-num" id="compPlanActiveInternal">$0.00</td>
                  <td id="compPlanIntBasis">Net</td>
                  <td id="compPlanIntEffective">—</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Change pay: one form, one atomic save (D-034) -->
        <div class="form-section">
          <div class="fv-dialog-section-title" id="compPlanChangeTitle">Change pay</div>
          <div class="fv-plan-edit">
            <div class="form-field">
              <label for="compPlanInternalAmount">Internal USD cash, paid locally</label>
              <input inputmode="decimal" type="number" id="compPlanInternalAmount" step="0.01" min="0" placeholder="0.00" style="text-align: right;" oninput="onCompPlanInput()">
              <div class="fv-plan-hint" id="compPlanInternalDelta"></div>
            </div>
            <div class="form-field">
              <label for="compPlanSalaryBasis">Basis</label>
              <select id="compPlanSalaryBasis">
                <option value="NET" selected>Net</option>
                <option value="GROSS">Gross</option>
              </select>
            </div>
            <div class="form-field">
              <label for="compPlanExternalAmount">External USD, US transfer</label>
              <input inputmode="decimal" type="number" id="compPlanExternalAmount" step="0.01" min="0" placeholder="0.00" style="text-align: right;" oninput="onCompPlanInput()">
              <div class="fv-plan-hint" id="compPlanExternalDelta"></div>
            </div>
            <div class="form-field">
              <label>Basis</label>
              <div class="fv-plan-hint">Net</div>
            </div>
          </div>
          <div class="fv-plan-total" id="compPlanNewTotal" aria-live="polite"></div>
          <div class="form-grid">
            <div class="form-field">
              <label for="compPlanStartDate">Effective from</label>
              <input type="date" id="compPlanStartDate" oninput="onCompPlanInput()">
              <div class="fv-plan-hint" id="compPlanEarliestHint"></div>
            </div>
            <div class="form-field full">
              <label for="compPlanNotes">Note, optional</label>
              <textarea id="compPlanNotes" rows="2" placeholder="Why this changes"></textarea>
            </div>
          </div>
          <div class="fv-plan-hint" id="compPlanBothZeroError" role="alert" style="display:none;">At least one component must be above 0.</div>
        </div>

        <!-- Pay history: one row per change (D-035) -->
        <details class="form-section" id="compPlanHistoryDetails">
          <summary class="fv-dialog-section-title" id="compPlanHistorySummary">History</summary>
          <div style="max-height:220px; overflow-y:auto; border:1px solid var(--fv-line); border-radius:10px;">
            <table class="responsive-card-table" style="font-size:12.5px;">
              <thead>
                <tr>
                  <th>Effective</th>
                  <th>Internal</th>
                  <th>External</th>
                  <th>Total</th>
                  <th>Change</th>
                  <th>Reason</th>
                </tr>
              </thead>
              <tbody id="compPlanHistoryBody"></tbody>
            </table>
          </div>
        </details>
      </div>
      <div class="modal-foot">
        <button class="btn" id="compPlanCloseBtn" onclick="closeModal('compensationPlanModal')">Cancel</button>
        <button class="btn btn-fill" id="compPlanSaveBtn" onclick="saveCompPlanComponent(event)">Save pay change</button>
      </div>
    </div>
  </div>
