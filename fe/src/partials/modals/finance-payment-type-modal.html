  <div class="modal-overlay fv fv-dialog fv-area-slate" id="financePaymentTypeModal">
    <div class="modal modal-v2" role="dialog" aria-modal="true" aria-labelledby="financePaymentTypeModalTitle">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M3 6h18M3 14h18M3 18h18"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="financePaymentTypeModalTitle">Add Payment Type</h3>
          <p>Configure payment methods and rule triggers (cheque registers, bank fee requirements).</p>
        </div>
        <button class="modal-close" onclick="closeModal('financePaymentTypeModal')" aria-label="Close dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="fFinancePaymentTypeId">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="fFinancePaymentTypeName">Name <span class="req">*</span></label>
              <input id="fFinancePaymentTypeName" placeholder="e.g. Cheque Payment, Cash Withdrawal, Wire Transfer">
            </div>
            <div class="form-field full">
              <label for="fFinancePaymentTypeCode">Code (Machine Key) <span class="req">*</span></label>
              <input id="fFinancePaymentTypeCode" aria-describedby="fFinancePaymentTypeCodeHelp" placeholder="e.g. CHK, CASH, INTTRANS, DEBIT_CARD" style="font-variant-numeric:tabular-nums;text-transform:uppercase;">
              <span id="fFinancePaymentTypeCodeHelp" style="font-size:11px;color:var(--ink-muted);margin-top:4px;display:block;">Stable identifier used by accounting and automated rules.</span>
            </div>
            <div class="form-field full" style="margin-top:8px;">
              <label for="fFinancePaymentTypeReqCheque" style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;font-weight:500;">
                <input type="checkbox" id="fFinancePaymentTypeReqCheque" style="width:16px;height:16px;cursor:pointer;">
                <span><strong>Requires Cheque Number</strong> (prompts cheque number and links into the cheque register)</span>
              </label>
            </div>
            <div class="form-field full" style="margin-top:8px;">
              <label for="fFinancePaymentTypeReqBankFee" style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;font-weight:500;">
                <input type="checkbox" id="fFinancePaymentTypeReqBankFee" style="width:16px;height:16px;cursor:pointer;">
                <span><strong>Requires Bank Fee Flag</strong> (prompts for related bank fee transaction)</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('financePaymentTypeModal')">Cancel</button>
        <button class="btn btn-fill" id="financePaymentTypeSaveBtn" onclick="saveFinancePaymentType()">Save Payment Type</button>
      </div>
    </div>
  </div>
