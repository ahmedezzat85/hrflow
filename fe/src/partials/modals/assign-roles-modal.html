  <div class="modal-overlay fv fv-dialog fv-dialog--w520 fv-area-pink" id="assignRolesModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg></span>

          <h3 id="assignRolesModalTitle">Assign role</h3>

        <button class="modal-close" onclick="closeModal('assignRolesModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>

        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="assignRolesCancelBtn" onclick="closeModal('assignRolesModal')">Cancel</button>

      </div>
    </div>
  </div>
