  <div class="modal-overlay" id="assignRolesModal">
    <div class="modal modal-v2" style="max-width: 500px; width: 95%;">
      <div class="modal-head">
        <div class="modal-head-icon"><i class="fa-solid fa-users-gear"></i></div>
        <div class="modal-head-text">
          <h3 id="assignRolesModalTitle">Assign Roles</h3>
          <p id="assignUserDisplay">Select roles to grant to this user.</p>
        </div>
        <button class="modal-close" onclick="closeModal('assignRolesModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
        <div class="form-section">
          <div class="form-section-label"><i class="fa-solid fa-shield-halved"></i> Available Roles <span class="line"></span></div>
          <div id="assignRolesChecklist" style="display:flex; flex-direction:column; gap:8px;">
            <!-- Checkboxes rendered dynamically -->
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="assignRolesCancelBtn" onclick="closeModal('assignRolesModal')">Cancel</button>
        <button class="btn btn-fill" id="assignRolesSaveBtn" onclick="saveUserRoleAssignments(event)"><i class="fa-solid fa-check"></i> Save Assignments</button>
      </div>
    </div>
  </div>
