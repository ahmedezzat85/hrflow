  <div class="modal-overlay fv fv-dialog fv-dialog--w520 fv-area-pink" id="assignRolesModal">
    <div class="modal modal-v2" style="width: 520px; background: var(--fv-surface); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;">
      <div class="modal-head" style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--fv-line);">
        <span class="modal-head-icon" id="assignRolesHeadIcon" style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: var(--violet-soft); color: var(--violet-ink); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>
        </span>
        <div class="modal-head-text" style="flex: 1;">
          <h3 id="assignRolesModalTitle" style="margin: 0; font-family: var(--font-display, Sora, sans-serif); font-size: 17px; font-weight: 700; color: var(--ink-strong);">Assign role</h3>
          <p id="assignUserDisplay" style="font-size: 12.5px; color: var(--ink-muted); margin: 0;">Select the role for this user.</p>
        </div>
        <button class="modal-close" onclick="closeModal('assignRolesModal')" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: var(--ink-label); display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body" style="padding: 14px 22px; max-height: 60vh; overflow-y: auto;">
        <div class="form-section">
          <p id="assignRoleNote" style="font-size:12px; color:var(--ink-muted); margin:0 0 10px;"></p>
          <div id="assignRolesChecklist" role="radiogroup" aria-labelledby="assignRolesModalTitle" style="display:flex; flex-direction:column; gap:8px;">
            <!-- One role per user: radio buttons rendered dynamically -->
          </div>
        </div>
      </div>
      <div class="modal-foot" style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--fv-line); background: var(--fv-surface-soft);">
        <button class="btn" id="assignRolesCancelBtn" onclick="closeModal('assignRolesModal')" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: var(--ink-label); font-weight: 600; font-size: 13px;">Cancel</button>
        <button class="btn btn-fill" id="assignRolesSaveBtn" onclick="saveUserRoleAssignments(event)" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; font-weight: 600; font-size: 13px;">Save role</button>
      </div>
    </div>
  </div>
