  <div class="modal-overlay" id="externalUserModal">
    <div class="modal modal-v2" style="max-width: 500px; width: 95%;">
      <div class="modal-head">
        <div class="modal-head-icon"><i class="fa-solid fa-user-plus"></i></div>
        <div class="modal-head-text">
          <h3 id="externalUserModalTitle">Add External User</h3>
          <p>An external user has no employee record and needs exactly one role.</p>
        </div>
        <button class="modal-close" onclick="closeModal('externalUserModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label>Email <span class="req">*</span></label>
              <input id="fExtUserEmail" type="email" placeholder="name@example.com">
            </div>
            <div class="form-field full">
              <label>Name</label>
              <input id="fExtUserName" placeholder="Full name">
            </div>
            <div class="form-field full">
              <label>Role <span class="req">*</span></label>
              <select id="fExtUserRole"></select>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="extUserCancelBtn" onclick="closeModal('externalUserModal')">Cancel</button>
        <button class="btn btn-fill" id="extUserSaveBtn" onclick="saveExternalUser(event)"><i class="fa-solid fa-check"></i> Add User</button>
      </div>
    </div>
  </div>
