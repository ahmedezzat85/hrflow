  <div class="modal-overlay fv fv-dialog fv-dialog--w520 fv-area-pink" id="externalUserModal">

        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"></path></svg></span>

            <div class="form-field full">
              <label for="fExtUserName">Name</label>
              <input id="fExtUserName" placeholder="Full name">

            <div class="form-field full">
              <label for="fExtUserRole">Role <span class="req">*</span></label>
              <select id="fExtUserRole"></select>

      </div>
    </div>
  </div>
