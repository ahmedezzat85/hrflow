  <div class="modal-overlay" id="documentPreviewModal">
    <div class="modal" style="max-width:900px;width:92vw;">
      <div class="modal-head">
        <h3 id="docPreviewTitle">Document Preview</h3>
        <button class="modal-close" onclick="closeDocumentPreview()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div id="docPreviewContainer"
          style="width:100%;height:75vh;background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:auto;">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeDocumentPreview()">Close</button>
        <a id="docPreviewDownloadBtn" class="btn btn-fill" href="#" target="_blank"><i class="fa-solid fa-download"></i>
          Download</a>
      </div>
    </div>
  </div>
