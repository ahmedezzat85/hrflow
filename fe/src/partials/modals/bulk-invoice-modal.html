  <div class="modal-overlay" id="bulkInvoiceModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <div class="modal-head-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <div class="modal-head-text">
          <h3 id="bulkInvoiceModalTitle">Generate Invoices Batch</h3>
          <p id="bulkInvoiceModalSubtitle">Process consultant fee invoices for external-salary employees.</p>
        </div>
        <button class="modal-close" onclick="closeModal('bulkInvoiceModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-4);margin-bottom:var(--space-4);">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:12px;color:var(--text2);">Billing Period</span>
            <strong id="bulkModalPeriod" style="font-size:13px;color:var(--text);">-</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:12px;color:var(--text2);">Ready for Generation</span>
            <span id="bulkEligibleCount" class="badge-pill pill-success">0</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="font-size:12px;color:var(--text2);">Already Generated</span>
            <span id="bulkExistingCount" class="badge-pill pill-info">0</span>
          </div>
        </div>
        <div class="form-field full" style="margin-bottom:6px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;">
            <input type="checkbox" id="bulkRegenerateExisting" style="width:16px;height:16px;accent-color:var(--accent);">
            <span>Regenerate and overwrite already-existing invoices</span>
          </label>
          <span style="font-size:11.5px;color:var(--text3);margin-left:24px;display:block;margin-top:2px;">
            If unchecked, already-generated invoices will be preserved.
          </span>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('bulkInvoiceModal')">Cancel</button>
        <button class="btn btn-fill" id="btnConfirmBulkGenerate" onclick="executeBulkGenerateInvoices(event)"><i class="fa-solid fa-check"></i> Generate Batch</button>
      </div>
    </div>
  </div>
