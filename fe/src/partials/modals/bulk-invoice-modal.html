  <div class="modal-overlay fv fv-dialog fv-dialog--w540 fv-area-teal" id="bulkInvoiceModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="bulkInvoiceModalTitle">Generate salary payment docs</h3>
          <p id="bulkInvoiceModalSubtitle">For employees paid an external USD salary</p>
        </div>
        <button class="modal-close" onclick="closeModal('bulkInvoiceModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-field full hv-mb-12">
          <label>Period</label>
          <div class="hv-bold" id="bulkModalPeriod">—</div>
        </div>
        <div class="hv-grid hv-grid-2 hv-mb-12">
          <div class="fv-dialog-tile">
            <div class="fv-dialog-tile__label">Ready to generate</div>
            <div class="fv-dialog-tile__value" id="bulkEligibleCount">0</div>
          </div>
          <div class="fv-dialog-tile">
            <div class="fv-dialog-tile__label">Already generated</div>
            <div class="fv-dialog-tile__value" id="bulkExistingCount">0</div>
          </div>
        </div>
        <div class="form-field full" style="margin-bottom:6px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-strong);">
            <input type="checkbox" id="bulkRegenerateExisting" style="width:16px;height:16px;accent-color:var(--brand);">
            <span>Regenerate and overwrite already-existing docs</span>
          </label>
          <span style="font-size:11.5px;color:var(--ink-muted);margin-left:24px;display:block;margin-top:2px;">
            If unchecked, already-generated docs will be preserved.
          </span>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('bulkInvoiceModal')">Cancel</button>
        <button class="btn btn-fill" id="btnConfirmBulkGenerate" onclick="executeBulkGenerateInvoices(event)">Generate batch</button>
      </div>
    </div>
  </div>
