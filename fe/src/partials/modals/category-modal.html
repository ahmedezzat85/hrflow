  <div class="modal-overlay fv fv-dialog fv-dialog--w480 fv-area-teal" id="categoryModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-8-5.2-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 14.8 12 20 12 20z"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="categoryModalTitle">Add category</h3>
          <p>A coverage category and its yearly limit</p>
        </div>
        <button class="modal-close" onclick="closeModal('categoryModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="fCatName">Category name <span class="req">*</span></label>
              <input id="fCatName" placeholder="Optical">
            </div>
            <div class="form-field full">
              <label for="fCatLimit">Annual limit <span class="req">*</span></label>
              <div class="input-group">
                <span class="input-addon">EGP</span>
                <input min="0" inputmode="decimal" type="number" id="fCatLimit" placeholder="1500" style="text-align: right;">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="categoryModalCancelBtn" onclick="closeModal('categoryModal')">Cancel</button>
        <button class="btn btn-fill" id="categoryModalSaveBtn" onclick="saveCategory(event)">Save category</button>
      </div>
    </div>
  </div>
