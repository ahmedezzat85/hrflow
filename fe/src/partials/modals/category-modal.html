  <div class="modal-overlay" id="categoryModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <div class="modal-head-icon"><i class="fa-solid fa-list-check"></i></div>
        <div class="modal-head-text">
          <h3 id="categoryModalTitle">Add Category</h3>
          <p>Configure coverage categories and annual spending limits.</p>
        </div>
        <button class="modal-close" onclick="closeModal('categoryModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-section-label"><i class="fa-solid fa-sliders"></i> Category Settings <span class="line"></span></div>
          <div class="form-grid">
            <div class="form-field full">
              <label>Category Name <span class="req">*</span></label>
              <input id="fCatName" placeholder="e.g. Dental">
            </div>
            <div class="form-field full">
              <label>Annual Limit <span class="opt">EGP</span> <span class="req">*</span></label>
              <input type="number" id="fCatLimit" placeholder="10000">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="categoryModalCancelBtn" onclick="closeModal('categoryModal')">Cancel</button>
        <button class="btn btn-fill" id="categoryModalSaveBtn" onclick="saveCategory(event)"><i class="fa-solid fa-check"></i> Save</button>
      </div>
    </div>
  </div>
