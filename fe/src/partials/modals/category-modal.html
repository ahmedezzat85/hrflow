  <div class="modal-overlay fv fv-dialog fv-dialog--w480 fv-area-teal" id="categoryModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="categoryModalTitle">Add category</h3>
          <p>Configure coverage categories and annual spending limits.</p>
        </div>
        <button class="modal-close" onclick="closeModal('categoryModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="fCatName">Category name <span class="req">*</span></label>
              <input id="fCatName" placeholder="e.g. Dental">
            </div>
            <div class="form-field full">
              <label for="fCatLimit">Annual limit <span class="opt">EGP</span> <span class="req">*</span></label>
              <input min="0" inputmode="decimal" type="number" id="fCatLimit" placeholder="10000">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="categoryModalCancelBtn" onclick="closeModal('categoryModal')">Cancel</button>
        <button class="btn btn-fill" id="categoryModalSaveBtn" onclick="saveCategory(event)">Save</button>
      </div>
    </div>
  </div>
