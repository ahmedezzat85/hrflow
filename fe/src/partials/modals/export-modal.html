  <div class="modal-overlay fv fv-dialog fv-dialog--w560 fv-area-blue" id="exportModal" onclick="if(event.target===this)closeExportModal()">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg></span>
        <div class="modal-head-text">
          <h3>Export data</h3>
          <p>Export operational and financial records to local CSV or Google Sheets.</p>
        </div>
        <button class="modal-close" onclick="closeExportModal()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <!-- Dataset Selector -->
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="exportDatasetSelect">Select dataset <span class="req">*</span></label>
              <select id="exportDatasetSelect" onchange="onExportDatasetChange()">
                <optgroup label="HR &amp; People Operations">
                  <option value="employees">Employees (Full profiles, salaries, banking, contact)</option>
                  <option value="insurance">Medical Insurance (Claims, categories, providers &amp; amounts)</option>
                  <option value="salary">Salary History (Raises, revisions &amp; percentages)</option>
                  <option value="vacations">Vacation History (Leave tracking &amp; durations)</option>
                  <option value="invoices">Salary payment docs (Generated external-salary payment records)</option>
                </optgroup>
                <optgroup label="Finance &amp; Accounting">
                  <option value="finance_ledger">General Ledger (Journal entries, accounts, debits &amp; credits)</option>
                  <option value="finance_accounts">Bank &amp; Treasury Accounts (Balances, currencies, IBANs)</option>
                  <option value="finance_invoices">Sales Invoices (Client billing, VAT, collections)</option>
                  <option value="finance_bills">Bills &amp; Payables (Vendor invoices, categories &amp; payments)</option>
                  <option value="finance_cheques">Cheques &amp; Custody (Inward/outward status &amp; clearance)</option>
                  <option value="finance_transfers">Transfers &amp; FX (Internal movements, fees &amp; conversions)</option>
                  <option value="finance_subscriptions">Subscriptions (SaaS tools, billing cycle &amp; renewals)</option>
                </optgroup>
              </select>
            </div>
          </div>
        </div>

        <!-- Period Filter (Conditional) -->
        <div class="form-section" id="exportPeriodSection" style="display:none;">
          <div class="form-grid">
            <div class="form-field full">
              <label for="exportPeriodType">Timeframe</label>
              <select id="exportPeriodType" onchange="onExportPeriodTypeChange()">
                <option value="all">All Records</option>
                <option value="year" selected>Specific Calendar Year</option>
                <option value="range">Custom Date Range</option>
              </select>
            </div>
            <div class="form-field full" id="exportYearGroup">
              <label for="exportYearFilter">Year</label>
              <input type="number" id="exportYearFilter" min="2020" max="2030" value="2026">
            </div>
            <div class="form-field full" id="exportRangeGroup" style="display:none;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                  <label>Start Date</label>
                  <input type="date" id="exportStartDateFilter" aria-label="Start date">
                </div>
                <div>
                  <label>End Date</label>
                  <input type="date" id="exportEndDateFilter" aria-label="End date">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Destination Format -->
        <div class="form-section">
          <label style="font-size:12.5px;font-weight:600;color:var(--ink-label);margin-bottom:6px;display:block;">Destination format</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <label class="export-format-card" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--fv-line);background:var(--fv-surface-soft);cursor:pointer;">
              <input type="radio" name="exportFormat" id="exportFormatCsv" value="csv" checked onchange="toggleExportFormatFields('csv')" style="margin-top:3px;">
              <div>
                <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-strong);"><i class="fa-solid fa-file-csv" style="color:var(--id-teal);"></i> Local CSV</div>
                <div style="font-size:11.5px;color:var(--ink-muted);margin-top:2px;">Excel-compatible UTF-8 BOM download.</div>
              </div>
            </label>
            <label class="export-format-card" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--fv-line);background:var(--fv-surface-soft);cursor:pointer;">
              <input type="radio" name="exportFormat" id="exportFormatSheets" value="sheets" onchange="toggleExportFormatFields('sheets')" style="margin-top:3px;">
              <div>
                <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-strong);"><i class="fa-solid fa-table-cells" style="color:var(--id-blue);"></i> Google Sheets</div>
                <div style="font-size:11.5px;color:var(--ink-muted);margin-top:2px;">Export into spreadsheet worksheet tab.</div>
              </div>
            </label>
          </div>
        </div>

        <!-- Google Sheets options -->
        <div id="exportSheetsGroup" style="display:none;">
          <div class="form-section">
            <div class="form-grid">
              <div class="form-field full">
                <label for="exportWorksheetTitle">Worksheet Title <span class="opt">Optional</span></label>
                <input type="text" id="exportWorksheetTitle" placeholder="Employees_Export_20260907">
                <span style="font-size:11px;color:var(--ink-muted);margin-top:4px;display:block;">
                  Creates a new tab or refreshes an existing tab in the company Google Spreadsheet.
                </span>
              </div>
              <div class="form-field full" style="margin-top:4px;">
                <div id="exportSheetsStatusBadge" style="font-size:12px;padding:6px 10px;background:var(--fv-surface-soft);color:var(--ink-muted);border-radius:8px;display:inline-flex;align-items:center;gap:6px;">
                  <i class="fa-solid fa-circle-notch fa-spin"></i> Checking Google Sheets connection...
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeExportModal()">Cancel</button>
        <button class="btn btn-fill" id="executeExportBtn" onclick="executeExport()">Export now</button>
      </div>
    </div>
  </div>
