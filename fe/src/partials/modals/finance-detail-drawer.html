<!-- Finance Detail Drawer & Activity Timeline (Story 1.3) -->
<div id="financeDetailDrawerOverlay" class="finance-drawer-overlay fv" style="display: none;" role="presentation">
  <div id="financeDetailDrawer" class="finance-drawer" role="dialog" aria-modal="true" aria-labelledby="financeDetailDrawerTitle" tabindex="-1">
    <!-- Drawer Header -->
    <div class="finance-drawer-head">
      <div class="fv-drawer-head__text">
        <div class="fv-drawer-head__badges">
          <span id="financeDetailDrawerBadge" class="badge badge-info fv-drawer-kind">Record</span>
          <span id="financeDetailDrawerStatusBadge"></span>
          <span id="financeDetailDrawerMaskedBadge" class="badge badge-grey" style="display: none;" title="Sensitive fields like account numbers or tax IDs are masked for privacy"><i class="fa-solid fa-shield-halved"></i> Masked</span>
        </div>
        <h3 id="financeDetailDrawerTitle" class="fv-drawer-title">Record Detail</h3>
      </div>
      <div class="fv-drawer-head__actions">
        <div id="financeDetailDrawerActions" class="fv-drawer-head__buttons"></div>
        <button type="button" class="btn btn-sm btn-outline finance-drawer-close" id="financeDetailDrawerCloseBtn" aria-label="Close detail drawer" title="Close (Esc)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Drawer Tabs -->
    <div class="finance-drawer-nav">
      <div class="filter-tabs fv-subnav" role="tablist" aria-label="Record detail sections" id="financeDrawerTablist">
        <button type="button" class="filter-tab active" data-drawer-tab="summary" role="tab" aria-selected="true" id="tabDrawerSummary">
          <i class="fa-solid fa-circle-info"></i> Overview
        </button>
        <button type="button" class="filter-tab" data-drawer-tab="timeline" role="tab" aria-selected="false" id="tabDrawerTimeline">
          <i class="fa-solid fa-clock-rotate-left"></i> Activity Timeline
        </button>
        <button type="button" class="filter-tab" data-drawer-tab="related" role="tab" aria-selected="false" id="tabDrawerRelated">
          <i class="fa-solid fa-link"></i> Related Records
        </button>
        <button type="button" class="filter-tab" data-drawer-tab="attachments" role="tab" aria-selected="false" id="tabDrawerAttachments">
          <i class="fa-solid fa-paperclip"></i> Attachments
        </button>
      </div>
    </div>

    <!-- Loading Bar -->
    <div id="financeDrawerLoading" class="section-loading-bar"><span></span></div>

    <!-- Drawer Body -->
    <div class="finance-drawer-body" id="financeDrawerBody">
      <!-- 1. Overview Panel -->
      <div id="financeDrawerSummaryPanel" class="drawer-tab-panel active" role="tabpanel" aria-labelledby="tabDrawerSummary">
        <div class="fv-summary fv-summary--between fv-drawer-summary">
          <div>
            <div class="fv-sub">Total amount</div>
            <div id="financeDrawerAmountDisplay" class="fv-summary__amount">—</div>
          </div>
          <div class="fv-summary__side">
            <div class="fv-sub">Counterparty</div>
            <div id="financeDrawerCounterpartyDisplay" class="fv-summary__name">—</div>
          </div>
        </div>

        <div class="fv-section-title">Key attributes</div>
        <div id="financeDrawerAttributesList" class="drawer-attributes-grid"></div>

        <div id="financeDrawerNotesSection" style="margin-top: 16px; display: none;">
          <div class="fv-section-title">Notes &amp; memo</div>
          <div id="financeDrawerNotesDisplay" class="fv-drawer-notes"></div>
        </div>
      </div>

      <!-- 2. Timeline Panel -->
      <div id="financeDrawerTimelinePanel" class="drawer-tab-panel" role="tabpanel" aria-labelledby="tabDrawerTimeline" style="display: none;">
        <div id="financeDrawerTimelineList" class="timeline-stream"></div>
      </div>

      <!-- 3. Related Records Panel -->
      <div id="financeDrawerRelatedPanel" class="drawer-tab-panel" role="tabpanel" aria-labelledby="tabDrawerRelated" style="display: none;">
        <div id="financeDrawerRelatedList" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>

      <!-- 4. Attachments Panel -->
      <div id="financeDrawerAttachmentsPanel" class="drawer-tab-panel" role="tabpanel" aria-labelledby="tabDrawerAttachments" style="display: none;">
        <div id="financeDrawerAttachmentsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </div>
  </div>
</div>
