  <div class="modal-overlay fv fv-dialog fv-dialog--w580 fv-area-teal" id="behalfVacationModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9M12 12v7a2 2 0 0 0 4 0"></path></svg></span>
        <div class="modal-head-text">
          <h3>Record leave on behalf</h3>
          <p>Log a leave or remote work request for this employee</p>
        </div>
        <button class="modal-close" onclick="closeModal('behalfVacationModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="bvType">Type <span class="req">*</span></label>
              <select id="bvType">
                <option>Annual Leave</option>
                <option>Sick Leave</option>
                <option>Work From Home</option>
                <option>Unpaid Leave</option>
              </select>
            </div>
            <div class="form-field">
              <label for="bvStart">Start date <span class="req">*</span></label>
              <input type="date" id="bvStart">
            </div>
            <div class="form-field">
              <label for="bvEnd">End date</label>
              <input type="date" id="bvEnd">
            </div>
            <div class="form-field full">
              <label for="bvDays">Days <span class="opt">Count</span></label>
              <input type="number" id="bvDays" value="1" min="1">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-grid">
            <div class="form-field">
              <label for="bvStatus">Status</label>
              <select id="bvStatus">
                <option value="Approved">Approved</option>
                <option value="Pending">Pending</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
            <div class="form-field">
              <label for="bvRecordDate">Record date <span class="opt">Optional</span></label>
              <input type="date" id="bvRecordDate">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="behalfVacationCancelBtn" onclick="closeModal('behalfVacationModal')">Cancel</button>
        <button class="btn btn-fill" id="behalfVacationSaveBtn" onclick="submitBehalfVacation(event)">Submit</button>
      </div>
    </div>
  </div>
