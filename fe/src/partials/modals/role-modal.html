  <div class="modal-overlay fv fv-dialog fv-dialog--w700 fv-area-pink" id="roleModal">
    <div class="modal modal-v2" style="width: 700px; background: var(--fv-surface); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;">
      <div class="modal-head" style="display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--fv-line);">
        <span class="modal-head-icon" style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: var(--fv-area-pink-bg); color: var(--fv-area-pink-ink); display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg></span>
        <div class="modal-head-text" style="flex: 1;">
          <h3 id="roleModalTitle" style="margin: 0; font-family: var(--font-display, Sora, sans-serif); font-size: 17px; font-weight: 700; color: var(--ink-strong);">Create role</h3>
          <p style="font-size: 12.5px; color: var(--ink-muted); margin: 0;">Name the role and choose its permissions</p>
        </div>
        <button class="modal-close" onclick="closeModal('roleModal')" aria-label="Close" style="width: 32px; height: 32px; border-radius: 9px; color: var(--ink-label); display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body" style="padding: 16px 22px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow-y: auto;">
        <div id="roleModalLockedBanner" style="display:none; padding:10px 12px; border-radius:12px; background:var(--fv-surface-soft); color:var(--ink-muted); font-size:13px;">
          <i class="fa-solid fa-lock" style="margin-right:6px;"></i>This role is locked. It always holds every permission and cannot be edited, renamed or deleted.
        </div>
        <div class="form-section">
          <div class="form-grid" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px 16px;">
            <div class="form-field" style="display: flex; flex-direction: column; gap: 5px;">
              <label for="fRoleName" style="font-size: 12.5px; font-weight: 600; color: var(--ink-label);">Role name</label>
              <input id="fRoleName" placeholder="HR-Assistant" style="height: 36px; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 9px; font-size: 14px; background: var(--fv-surface); color: var(--ink-strong);">
            </div>
            <div class="form-field" style="display: flex; flex-direction: column; gap: 5px;">
              <label for="fRoleDescription" style="font-size: 12.5px; font-weight: 600; color: var(--ink-label);">Description</label>
              <input id="fRoleDescription" placeholder="What people with this role do" style="height: 36px; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 9px; font-size: 14px; background: var(--fv-surface); color: var(--ink-strong);">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <span style="font-size: 13px; font-weight: 700; color: var(--ink-strong);">Permissions <span id="rolePermSelectedCount" style="font-weight: 500; color: var(--ink-muted);">· 0 selected</span></span>
            <div class="search-box" style="display: flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 8px; background: var(--fv-surface); color: var(--ink-muted); font-size: 13px; width: 220px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
              <input type="text" id="rolePermSearch" aria-label="Search permissions" placeholder="Filter permissions" style="border: 0; outline: none; background: transparent; font-size: 13px; color: var(--ink-strong); width: 100%; padding: 0;">
            </div>
          </div>
          <div id="rolePermissionsContainer" style="height: 340px; overflow-y: auto; border: 1px solid var(--fv-line); border-radius: 12px; background: var(--fv-surface);">
            <!-- Rendered dynamically by category with implication auto-ticking -->
          </div>
        </div>
      </div>
      <div class="modal-foot" style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--fv-line); background: var(--fv-surface-soft);">
        <button class="btn" id="roleModalCancelBtn" onclick="closeModal('roleModal')" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9px; color: var(--ink-label); font-weight: 600; font-size: 13px;">Cancel</button>
        <button class="btn btn-fill" id="roleModalSaveBtn" onclick="saveRole(event)" style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; font-weight: 600; font-size: 13px;">Save role</button>
      </div>
    </div>
  </div>
