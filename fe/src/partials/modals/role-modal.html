  <div class="modal-overlay fv fv-dialog fv-dialog--w700 fv-area-pink" id="roleModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="roleModalTitle">Create role</h3>
          <p>Define role identity and assign granular domain permissions.</p>
        </div>
        <button class="modal-close" onclick="closeModal('roleModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
        <div id="roleModalLockedBanner" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:12px; background:var(--fv-surface-soft); color:var(--ink-muted); font-size:13px;">
          <i class="fa-solid fa-lock" style="margin-right:6px;"></i>This role is locked. It always holds every permission and cannot be edited, renamed or deleted.
        </div>
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="fRoleName">Role name <span class="req">*</span></label>
              <input id="fRoleName" placeholder="e.g. Compliance-Auditor">
            </div>
            <div class="form-field full">
              <label for="fRoleDescription">Description</label>
              <input id="fRoleDescription" placeholder="Brief summary of duties and responsibilities...">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <label style="font-size:13px;font-weight:700;color:var(--ink-strong);margin:0;">Permissions</label>
            <input type="text" id="rolePermSearch" aria-label="Search permissions" placeholder="Filter permissions..." style="padding: 4px 10px; font-size: 12.5px; width: 180px; border: 1px solid var(--fv-input-border); border-radius: 8px; background: var(--fv-surface); color: var(--ink-strong);">
          </div>
          <div id="rolePermissionsContainer" style="display:flex; flex-direction:column; gap:16px;">
            <!-- Rendered dynamically by category with implication auto-ticking -->
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="roleModalCancelBtn" onclick="closeModal('roleModal')">Cancel</button>
        <button class="btn btn-fill" id="roleModalSaveBtn" onclick="saveRole(event)">Save role</button>
      </div>
    </div>
  </div>
