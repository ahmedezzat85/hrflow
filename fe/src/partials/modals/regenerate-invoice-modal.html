  <div class="modal-overlay fv fv-dialog fv-dialog--w480 fv-area-ochre" id="regenerateInvoiceModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="regenModalTitle">Regenerate doc?</h3>
          <p id="regenModalSubtitle"><span id="regenEmpName">—</span> · <span id="regenPeriod">—</span></p>
        </div>
        <button class="modal-close" onclick="closeModal('regenerateInvoiceModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <span id="regenInvoiceNumber" hidden></span>
        <p class="hv-mb-12" style="font-size:13.5px;line-height:1.45;margin:0 0 12px 0;">
          A salary payment doc already exists for this period. Regenerating creates a new doc with the current salary and address details and updates the record.
        </p>
        <div class="warning-callout" style="padding:10px 12px;border-radius:12px;background:var(--warning-soft);color:var(--warning);font-size:13px;">
          The current file is replaced. Download it first if you need a copy.
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('regenerateInvoiceModal')">Cancel</button>
        <button class="btn btn-fill" id="btnConfirmRegenerate" onclick="executeRegenerateInvoice(event)">Regenerate</button>
      </div>
    </div>
  </div>
