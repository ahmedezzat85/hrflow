  <div class="modal-overlay fv fv-dialog fv-dialog--w480 fv-area-ochre" id="regenerateInvoiceModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="regenModalTitle">Regenerate doc</h3>
          <p id="regenModalSubtitle">Overwrite and regenerate the salary payment doc.</p>
        </div>
        <button class="modal-close" onclick="closeModal('regenerateInvoiceModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div style="background:var(--fv-surface-soft);border:1px solid var(--fv-line);border-radius:12px;padding:12px 14px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:12px;color:var(--ink-muted);">Employee</span>
            <strong id="regenEmpName" style="font-size:13px;color:var(--ink-strong);">-</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:12px;color:var(--ink-muted);">Billing period</span>
            <span id="regenPeriod" style="font-size:13px;color:var(--ink-strong);font-weight:600;">-</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="font-size:12px;color:var(--ink-muted);">Existing doc #</span>
            <span id="regenInvoiceNumber" style="font-size:13px;font-variant-numeric:tabular-nums;color:var(--brand-ink);font-weight:600;">-</span>
          </div>
        </div>
        <p style="color:var(--ink-muted);font-size:13px;line-height:1.5;margin:0;">
          A salary payment doc has already been generated for this period. Regenerating will generate a new document with current salary and address details and update the record.
        </p>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('regenerateInvoiceModal')">Cancel</button>
        <button class="btn btn-fill" id="btnConfirmRegenerate" onclick="executeRegenerateInvoice(event)">Regenerate doc</button>
      </div>
    </div>
  </div>
