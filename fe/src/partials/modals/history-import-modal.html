  <div class="modal-overlay fv fv-dialog fv-dialog--w520 fv-area-teal" id="historyItemModal">
    <div class="modal modal-v2">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9M12 12v7a2 2 0 0 0 4 0"></path></svg></span>
        <div class="modal-head-text">
          <h3>Edit staged item</h3>
          <p id="hiEditSubtitle">Correct the leave before accepting it</p>
        </div>
        <button class="modal-close" onclick="closeModal('historyItemModal')" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field">
              <label for="hiType">Type</label>
              <select id="hiType">
                <option>Annual Leave</option>
                <option>Sick Leave</option>
                <option>Work From Home</option>
                <option>Unpaid Leave</option>
              </select>
            </div>
            <div class="form-field">
              <label for="hiDecision">Decision</label>
              <select id="hiDecision">
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
            <div class="form-field">
              <label for="hiStart">First day</label>
              <input type="date" id="hiStart">
            </div>
            <div class="form-field">
              <label for="hiEnd">Last day</label>
              <input type="date" id="hiEnd">
              <div class="fv-plan-hint">The server recounts the days, skipping Friday, Saturday and holidays</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="hiEditCancelBtn" onclick="closeModal('historyItemModal')">Cancel</button>
        <button class="btn btn-fill" id="hiEditSaveBtn" onclick="saveHistoryItemEdit(event)">Save changes</button>
      </div>
    </div>
  </div>
