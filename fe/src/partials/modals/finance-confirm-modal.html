<!-- Finance Confirm / High-Risk Command Modal (Story 0.4) -->
<div class="modal-overlay fv fv-dialog fv-area-slate" id="financeConfirmModal" role="dialog" aria-modal="true" aria-labelledby="financeConfirmTitle" aria-describedby="financeConfirmDescription" style="display:none;">
  <div class="modal modal-md fv-confirm">
    <div class="modal-head">
      <span id="financeConfirmIcon" class="fv-tile fv-tile--lg fv-tile--danger" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span>
      <div class="modal-head-text">
        <h3 id="financeConfirmTitle">Confirm Action</h3>
      </div>
      <button type="button" class="modal-close" onclick="FinanceCommand.handleConfirmCancel()" aria-label="Close confirmation dialog">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body">
      <div id="financeConfirmTargetSummary" class="fv-summary" style="display:none;"></div>

      <p id="financeConfirmDescription" class="fv-confirm__text"></p>

      <div id="financeConfirmReasonGroup" class="fv-field" style="display:none; flex-direction:column; gap:6px;">
        <label for="financeConfirmReason" class="fv-label">
          Reason for Action <span class="req">*</span>
        </label>
        <textarea id="financeConfirmReason" class="form-control" rows="2" placeholder="State reason for audit and financial history..."></textarea>
        <div id="financeConfirmReason_error" class="field-error-message" role="alert" style="display:none;"></div>
      </div>
    </div>

    <div class="modal-foot">
      <button type="button" id="financeConfirmCancelBtn" class="btn" onclick="FinanceCommand.handleConfirmCancel()">
        Cancel
      </button>
      <button type="button" id="financeConfirmSubmitBtn" class="btn btn-danger" onclick="FinanceCommand.handleConfirmSubmit()">
        Confirm
      </button>
    </div>
  </div>
</div>
