<!-- Finance Confirm / High-Risk Command Modal (Story 0.4) -->
<div class="modal-overlay" id="financeConfirmModal" role="dialog" aria-modal="true" aria-labelledby="financeConfirmTitle" aria-describedby="financeConfirmDescription" style="display:none;">
  <div class="modal modal-md">
    <div class="modal-head">
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="financeConfirmIcon" style="font-size:18px; color:var(--danger, #ef4444);"><i class="fa-solid fa-triangle-exclamation"></i></span>
        <h3 id="financeConfirmTitle" style="margin:0; font-size:16px; font-weight:700;">Confirm Action</h3>
      </div>
      <button type="button" class="modal-close" onclick="FinanceCommand.handleConfirmCancel()" aria-label="Close confirmation dialog" style="min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center;">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body" style="padding:1.25rem 1.5rem; display:flex; flex-direction:column; gap:1rem;">
      <div id="financeConfirmTargetSummary" style="display:none; padding:0.6rem 0.85rem; border-radius:6px; background:var(--bg2, rgba(0,0,0,0.03)); border:1px solid var(--border); font-size:13px; font-weight:600;"></div>
      
      <p id="financeConfirmDescription" style="margin:0; font-size:14px; color:var(--text2); line-height:1.5;"></p>

      <div id="financeConfirmReasonGroup" style="display:none; flex-direction:column; gap:6px;">
        <label for="financeConfirmReason" style="font-size:13px; font-weight:600; color:var(--text);">
          Reason for Action <span style="color:var(--danger, #ef4444);">*</span>
        </label>
        <textarea id="financeConfirmReason" class="form-control" rows="2" placeholder="State reason for audit and financial history..." style="width:100%; resize:vertical;"></textarea>
        <div id="financeConfirmReason_error" class="field-error-message" role="alert" style="display:none; color:var(--danger, #ef4444); font-size:12px; margin-top:2px;"></div>
      </div>
    </div>

    <div class="modal-foot" style="padding:0.85rem 1.5rem; display:flex; justify-content:flex-end; gap:0.75rem; border-top:1px solid var(--border);">
      <button type="button" id="financeConfirmCancelBtn" class="btn btn-outline" onclick="FinanceCommand.handleConfirmCancel()" style="min-height:40px;">
        Cancel
      </button>
      <button type="button" id="financeConfirmSubmitBtn" class="btn btn-danger" onclick="FinanceCommand.handleConfirmSubmit()" style="min-height:40px;">
        Confirm
      </button>
    </div>
  </div>
</div>
