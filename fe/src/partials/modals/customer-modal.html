  <div class="modal-overlay fv fv-dialog fv-area-teal" id="customerModal">
    <div class="modal modal-v2" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle">
      <div class="modal-head">
        <span class="modal-head-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M20 8v6M23 11h-6"></path></svg></span>
        <div class="modal-head-text">
          <h3 id="customerModalTitle">Add Customer</h3>
          <p>Register client organizations for sales billing, invoice generation, and receivables tracking.</p>
        </div>
        <button class="modal-close" onclick="closeModal('customerModal')" aria-label="Close dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>

      <!-- Duplicate Candidate Warning Banner -->
      <div id="customerDuplicateBanner" class="alert alert-warning" style="display:none; margin: 12px 24px 0 24px; padding: 10px 14px; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--warning-border); background: var(--warning-bg);" role="status">
        <div style="display:flex; align-items:flex-start; gap:8px;">
          <i class="fa-solid fa-triangle-exclamation" style="color:var(--warning); margin-top:2px;"></i>
          <div>
            <div style="font-weight:700;">Potential Duplicate Customer</div>
            <div id="customerDuplicateText" style="color:var(--ink-muted); margin-top:2px;">A customer with matching identity already exists.</div>
          </div>
        </div>
      </div>

      <div class="modal-body">
        <input type="hidden" id="fCustomerId">
        <div class="form-section">
          <div class="form-grid">
            <div class="form-field full">
              <label for="fCustomerName">Company / Display Name <span class="req">*</span></label>
              <input id="fCustomerName" placeholder="e.g. Apex Health Partners" oninput="onCustomerFieldInput()">
            </div>
            <div class="form-field full">
              <label for="fCustomerLegalName">Registered Legal Name</label>
              <input id="fCustomerLegalName" placeholder="e.g. Apex Healthcare Systems LLC" oninput="onCustomerFieldInput()">
            </div>
            <div class="form-field">
              <label for="fCustomerEmail">Billing Email</label>
              <input id="fCustomerEmail" type="email" placeholder="e.g. billing@apexhealth.com" oninput="onCustomerFieldInput()">
            </div>
            <div class="form-field">
              <label for="fCustomerPhone">Phone</label>
              <input id="fCustomerPhone" placeholder="e.g. +1 555-0120">
            </div>
            <div class="form-field full">
              <label for="fCustomerTaxId">Tax Identification / VAT Number</label>
              <input id="fCustomerTaxId" placeholder="e.g. US-88992211 or EG-44021" oninput="onCustomerFieldInput()">
            </div>
          </div>
        </div>

        <div class="form-section" style="margin-top:16px;">
          <div class="form-grid">
            <div class="form-field">
              <label for="fCustomerTerms">Payment Terms (Days)</label>
              <input id="fCustomerTerms" type="number" min="0" value="30" placeholder="e.g. 30">
            </div>
            <div class="form-field">
              <label for="fCustomerWithholding">Withholding tax (%)</label>
              <input id="fCustomerWithholding" type="number" min="0" max="100" step="0.01" value="0" placeholder="0 (normally none)">
            </div>
            <div class="form-field full">
              <label for="fCustomerCurrency">Default Currency</label>
              <select id="fCustomerCurrency">
                <option value="USD" selected>USD — US Dollars</option>
                <option value="EGP">EGP — Egyptian Pounds</option>
                <option value="EUR">EUR — Euros</option>
                <option value="GBP">GBP — British Pounds</option>
              </select>
            </div>
            <div class="form-field">
              <label for="fCustomerCountry">Country</label>
              <input id="fCustomerCountry" value="Egypt" placeholder="e.g. Egypt, United States">
            </div>
            <div class="form-field">
              <label for="fCustomerOwner">Account Owner</label>
              <input id="fCustomerOwner" placeholder="e.g. Sarah Connor">
            </div>
            <div class="form-field full">
              <label for="fCustomerAddress">Billing Address</label>
              <input id="fCustomerAddress" placeholder="e.g. 100 Medical Center Blvd, Suite 400">
            </div>
            <div class="form-field full">
              <label for="fCustomerNotes">Notes</label>
              <textarea id="fCustomerNotes" rows="2" placeholder="Payment terms, special instructions, or contract notes..."></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('customerModal')">Cancel</button>
        <button class="btn btn-fill" id="customerSaveBtn" onclick="saveCustomer()">Save Customer</button>
      </div>
    </div>
  </div>
