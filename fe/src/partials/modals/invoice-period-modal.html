  <div class="modal-overlay" id="invoicePeriodModal" onclick="if(event.target===this)closeModal('invoicePeriodModal')">
    <div class="modal invoice-period-popover-modal">
      <div class="invoice-popover-head">
        <div style="display:flex;align-items:center;gap:10px;">
          <button type="button" class="btn btn-sm" onclick="changeInvoicePopoverYear(-1)" title="Previous Year"><i class="fa-solid fa-chevron-left"></i></button>
