        <section class="page-section fv" id="e-insurance">
          <div class="card hv-mb-20">
            <div class="card-head">
              <h3>My insurance consumption</h3>
            </div>
            <div class="info-item hv-mb-16"><span>Total consumption</span><b
                id="empInsuranceTotalConsumed">—</b></div>
            <div class="grid g3" id="empInsuranceCategoryGrid"></div>
          </div>
          <div class="grid g-2-1 hv-mb-20">
            <div class="card">
              <div class="card-head">
                <h3>My insurance plan</h3>
              </div>
              <p class="hv-text2-13">Plan and provider details are not available here yet. Your claims and category limits are shown below.</p>
            </div>
            <div class="card">
              <div class="card-head" id="empClaimFormHead">
                <h3>Submit a claim</h3>
              </div>
              <div class="form-field hv-mb-12"><label for="claimCategory">Category</label><select
                  id="claimCategory"></select></div>
              <div class="form-field hv-mb-12"><label for="claimAmount">Amount (EGP)</label><input type="number"
                  id="claimAmount" inputmode="decimal" min="0" placeholder="e.g. 1500"></div>
              <div class="form-field hv-mb-12"><label for="claimDocument">Supporting document (optional)</label><input
                  type="file" id="claimDocument" accept=".pdf,.jpg,.jpeg,.png"></div>
              <button class="btn btn-fill hv-w-full" onclick="submitClaim()"><i
                  class="fa-solid fa-file-medical"></i> Submit claim</button>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <h3>Claims history</h3>
            </div>
            <table class="responsive-card-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Provider</th>
                  <th>Amount</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Document</th>
                </tr>
              </thead>
              <tbody id="empInsuranceBody"></tbody>
            </table>
          </div>
        </section>
