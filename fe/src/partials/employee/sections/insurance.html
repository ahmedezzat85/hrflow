        <section class="page-section fv" id="e-insurance">
          <div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; align-items: start;">
            <!-- Left card: My use this year -->
            <section class="card" style="background: var(--fv-surface); border: 1px solid var(--fv-line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--fv-shadow-card);">
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <h2 style="margin: 0; font-family: var(--font-display, Sora, sans-serif); font-size: 15px; color: var(--ink-strong);">My use this year</h2>
                <span id="empInsuranceTotalConsumed" style="font-family: var(--font-display, Sora, sans-serif); font-weight: 700; font-size: 20px; color: var(--ink-strong);">—</span>
              </div>
              <div id="empInsuranceCategoryGrid" style="display: flex; flex-direction: column; gap: 10px;"></div>
              <div style="padding: 9px 12px; border-radius: 11px; background: var(--fv-surface-soft); font-size: 12.5px; color: var(--ink-label);">Plan and provider details are not shown here yet. Ask HR for the policy document.</div>
            </section>

            <!-- Right card: Submit a claim -->
            <section class="card" style="background: var(--fv-surface); border: 1px solid var(--fv-line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--fv-shadow-card);">
              <h2 style="margin: 0; font-family: var(--font-display, Sora, sans-serif); font-size: 15px; color: var(--ink-strong);">Submit a claim</h2>
              <div id="empClaimForm" style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
                  <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-label);">
                    Category
                    <select id="claimCategory" style="height: 36px; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 9px; font-size: 14px; background: var(--fv-surface); color: var(--ink-strong);"></select>
                  </label>
                  <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-label);">
                    Amount
                    <span style="display: flex;">
                      <span style="display: inline-flex; align-items: center; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--fv-input-border); border-right: 0; border-radius: 9px 0 0 9px; background: var(--fv-surface-soft); color: var(--ink-muted); font-size: 13px;">EGP</span>
                      <input type="number" id="claimAmount" inputmode="decimal" min="0" placeholder="0.00" aria-label="Amount in EGP" style="height: 36px; flex: 1; min-width: 0; padding: 0 10px; border: 1px solid var(--fv-input-border); border-radius: 0 9px 9px 0; font-size: 14px; text-align: right; background: var(--fv-surface); color: var(--ink-strong);">
                    </span>
                  </label>
                </div>
                <label for="claimDocument" style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-label); cursor: pointer;">
                  Receipt, optional
                  <span style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: 1px dashed var(--fv-outline); border-radius: 11px; background: var(--fv-surface-soft); color: var(--brand-ink); font-weight: 600; font-size: 13px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"></path></svg>
                    <span id="claimDocumentLabel">Choose a file or drop it here</span>
                  </span>
                  <input type="file" id="claimDocument" accept=".pdf,.jpg,.jpeg,.png" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);" onchange="const l = document.getElementById('claimDocumentLabel'); if (l && this.files && this.files[0]) l.textContent = this.files[0].name;">
                </label>
                <button type="button" class="btn btn-fill" onclick="submitClaim(event)" style="align-self: flex-end; display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; font-weight: 600; font-size: 13px;">Submit claim</button>
              </div>
            </section>
          </div>

          <!-- My claims table -->
          <section class="card fv-table-card" style="background: var(--fv-surface); border: 1px solid var(--fv-line); border-radius: 14px; overflow: hidden; box-shadow: var(--fv-shadow-card);">
            <div style="padding: 12px 16px; border-bottom: 1px solid var(--fv-line);">
              <h2 style="margin: 0; font-family: var(--font-display, Sora, sans-serif); font-size: 15px; color: var(--ink-strong);">My claims</h2>
            </div>
            <div class="fv-table-scroll">
              <table class="responsive-card-table fv-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                  <tr>
                    <th scope="col" style="text-align: left; padding: 11px 16px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line);">Category</th>
                    <th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line);">Provider</th>
                    <th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: var(--brand); border-bottom: 1px solid var(--fv-line);">Date ↓</th>
                    <th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line);">Status</th>
                    <th scope="col" style="text-align: right; padding: 11px 12px; font-size: 12px; font-weight: 600; color: var(--ink-label); border-bottom: 1px solid var(--fv-line);">Amount</th>
                    <th scope="col" style="padding: 11px 16px; border-bottom: 1px solid var(--fv-line); text-align: right;"><span class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0);">Receipt</span></th>
                  </tr>
                </thead>
                <tbody id="empInsuranceBody"></tbody>
              </table>
            </div>
          </section>
        </section>
