      <div class="topbar">
        <div class="topbar-lead">
          <button class="hamburger" onclick="toggleSidebar('empSidebar')" aria-label="Toggle navigation menu"><i class="fa-solid fa-bars"></i></button>
          <span class="fv-tile fv-hue-blue" id="empAreaTile" aria-hidden="true"><i class="fa-solid fa-grip"></i></span>
          <h1 id="empPageTitle">My Dashboard</h1>
          <span class="fv-area-name" id="empAreaName">Workspace</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="empSearchBtn" onclick="openCommandPalette()" title="Search (Ctrl+K)" aria-label="Search across workspace (Ctrl+K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
          <div class="account-menu notif-menu">
            <button type="button" class="icon-btn" id="empNotifBtn" title="Notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="empNotifPanel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"></path></svg></button>
            <div class="account-panel notif-panel" id="empNotifPanel" role="region" aria-label="Notifications" hidden>
              <div class="notif-panel__title">Notifications</div>
              <div class="notif-panel__empty">No notifications yet</div>
            </div>
          </div>
          <div class="account-menu">
            <button type="button" class="account-trigger" id="empAccountBtn" aria-label="Account menu" aria-haspopup="true" aria-expanded="false" aria-controls="empAccountPanel">
              <span class="account-avatar"><span class="account-avatar__initials" data-account-initials="emp">--</span></span>
            </button>
            <div class="account-panel" id="empAccountPanel" hidden>
              <div class="account-panel__head">
                <span class="account-avatar account-avatar--lg"><span class="account-avatar__initials" id="empUserAvatar" data-account-initials="emp">--</span></span>
                <div class="account-panel__who">
                  <div class="account-panel__name" id="empUserName">--</div>
                  <div class="account-panel__role" id="empUserRole">--</div>
                </div>
              </div>
              <div class="account-panel__divider"></div>
              <div class="account-panel__row">
                <span class="account-panel__label" id="empAppearanceLabel">Appearance</span>
                <div class="theme-seg" role="group" aria-labelledby="empAppearanceLabel">
                  <button type="button" data-theme-choice="light" aria-pressed="true"><i class="fa-solid fa-sun"></i> Light</button>
                  <button type="button" data-theme-choice="dark" aria-pressed="false"><i class="fa-solid fa-moon"></i> Dark</button>
                </div>
              </div>
              <div class="account-panel__divider"></div>
              <button type="button" class="account-item account-item--danger" id="empSignOutBtn" onclick="closeTopbarPopovers();logout()"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
            </div>
          </div>
        </div>
      </div>
